<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신의 손 v9.8.3 - 텍스트 모드</title>
    <style>
        /* 검정 바탕에 가독성 중심 */
        body { background-color: #000; color: #ffd700; font-family: 'Malgun Gothic', sans-serif; padding: 15px; margin: 0; }
        .outer-border { border: 2px solid #ffd700; border-radius: 20px; padding: 5px; max-width: 450px; margin: 0 auto; }
        .inner-container { padding: 20px 10px; background: #000; }
        h1 { font-size: 26px; font-weight: 900; margin: 0; color: #ffd700; letter-spacing: 2px; }
        .target-box { color: #00ffcc; font-size: 13px; margin: 15px 0; border: 1px solid #00ffcc; padding: 10px; border-radius: 10px; font-weight: bold; }
        .btn-main { width: 100%; height: 60px; background: #ffd700; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; color: #000; margin-bottom: 20px; }
        
        /* 한 줄 출력 콘솔 */
        #console { background-color: #000; text-align: left; }
        .row-line { 
            border-bottom: 1px solid #222; 
            padding: 10px 0; 
            white-space: nowrap; /* 줄바꿈 절대 금지 */
            overflow-x: auto;    /* 혹시 작으면 옆으로 스크롤 */
            font-size: 22px;     /* 번호 시원시원하게 */
            display: flex;
            align-items: center;
        }
        .row-idx { font-size: 14px; color: #555; width: 30px; }
        .num-box { font-family: 'Consolas', monospace; font-weight: 900; margin-right: 12px; }
        
        /* 번호 색상 구분 */
        .fixed { color: #ff8c00; } /* 고정수: 주황 */
        .zero { color: #ff4500; text-decoration: underline; } /* 미출현: 빨강+밑줄 */
        .normal { color: #ffd700; } /* 일반: 금색 */
        .info { font-size: 12px; color: #444; margin-left: auto; }
    </style>
</head>
<body>
<div class="outer-border">
    <div class="inner-container">
        <h1 onclick="location.reload()">신 의 손 v9.8.3</h1>
        <div class="target-box">💎 제 1211회 분석 모드<br>동그라미 제거 / 텍스트 한 줄 출력 최적화</div>
        <button class="btn-main" onclick="process()">분석 엔진 10조합 가동</button>
        <div id="console"></div>
    </div>
</div>

<script>
    const DATA = [
        [1,7,9,17,27,38],[2,17,20,35,37,39],[6,27,30,36,38,42],[10,22,24,27,38,45],
        [1,3,17,26,27,42],[1,4,16,23,31,41],[8,16,28,30,31,44],[3,6,18,29,35,39],
        [5,12,21,33,37,40],[7,9,24,27,35,36],[1,2,4,16,20,32],[16,24,25,30,31,32],
        [26,30,33,38,39,41],[1,5,7,26,28,43],[8,12,15,29,40,45],[3,15,27,33,34,36],
        [3,13,15,24,33,37],[6,9,16,19,24,28],[10,16,23,36,39,40],[1,4,11,12,20,41],
        [7,9,19,23,26,45],[9,19,29,35,37,38],[3,4,12,19,22,27],[5,13,26,29,37,40],
        [2,8,13,16,23,28],[6,17,22,28,29,32],[14,16,23,25,31,37],[4,15,17,23,27,36],
        [1,13,21,25,28,31],[8,10,14,20,33,41]
    ];

    let top15 = [], zeroFreqNums = [], machineFixed = [];

    function analyze() {
        let freq = {}, serial = {}, last = {};
        for(let i=1; i<=45; i++) { freq[i]=0; serial[i]=0; last[i]=99; }
        DATA.forEach((row, idx) => {
            row.forEach((n, i) => {
                freq[n]++;
                if(last[n] === 99) last[n] = idx;
                if(i < 5 && row[i+1] === n + 1) { serial[n]++; serial[n+1]++; }
            });
        });
        machineFixed = [
            parseInt(Object.keys(freq).sort((a,b)=>freq[b]-freq[a])[0]),
            parseInt(Object.keys(serial).sort((a,b)=>serial[b]-serial[a])[0]),
            parseInt(Object.keys(freq).filter(n=>last[n]>=5).sort((a,b)=>freq[b]-freq[a])[0])
        ];
        zeroFreqNums = Object.keys(freq).filter(n => freq[n] === 0).map(Number);
        let wFreq = {};
        for(let i=1; i<=45; i++) wFreq[i] = 0;
        DATA.forEach((row, idx) => {
            let w = 1 + ((30-idx)/30);
            row.forEach(n => { wFreq[n] += w; });
        });
        top15 = Object.keys(wFreq).map(Number).sort((a,b) => wFreq[b] - wFreq[a]).slice(0, 15);
    }

    function process() {
        analyze();
        const box = document.getElementById('console');
        box.innerHTML = "";
        const targetBox = document.querySelector('.target-box');
        targetBox.innerHTML = `💎 제 1211회 고정수: ${machineFixed.join(', ')}`;

        const bonus = [35, 10, 43];
        let count = 0, used = new Set(), safety = 0;

        while(count < 10 && safety < 1000) {
            safety++;
            let res = [];
            if(count < 7) res.push(machineFixed[count % 3]);
            else res.push(bonus[count - 7]);
            
            let basket = [...top15].sort(() => Math.random() - 0.5);
            for(let n of basket) { if(res.length < 6 && !res.includes(n)) res.push(n); }
            while(res.length < 6) {
                let n = Math.floor(Math.random()*45)+1;
                if(!res.includes(n)) res.push(n);
            }
            res.sort((a,b)=>a-b);

            let sum = res.reduce((a,b)=>a+b, 0);
            let odds = res.filter(n=>n%2!==0).length;
            let pair = 0;
            for(let i=0; i<5; i++) { if(res[i+1]===res[i]+1) pair++; }

            let isPass = (sum >= 100 && sum <= 175) && (odds >= 2 && odds <= 4);
            if(count < 2) { if(pair !== 1) isPass = false; }
            else { if(pair >= 2) isPass = false; }

            if(!used.has(res.join(',')) && isPass) {
                used.add(res.join(','));
                count++;
                const numsHtml = res.map(n => {
                    let c = "normal";
                    if(machineFixed.includes(n)) c = "fixed";
                    if(zeroFreqNums.includes(n)) c = "zero";
                    return `<span class="num-box ${c}">${String(n).padStart(2,'0')}</span>`;
                }).join('');
                box.innerHTML += `<div class="row-line"><span class="row-idx">#${count}</span> ${numsHtml} <span class="info">합:${sum}</span></div>`;
            }
        }
    }
    window.onload = analyze;
</script>
</body>
</html>
