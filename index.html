<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIN-UI-SON - 1213회 (게임센터 포함)</title>
    <style>
        :root { --gold: #ffd700; --bg: #0b0b0b; --card: #1a1a1a; --accent: #00ffcc; --save: #ff00ff; --danger: #ff4444; }
        body { background-color: var(--bg); color: var(--gold); font-family: 'Malgun Gothic', sans-serif; padding: 10px; margin: 0; }
        .outer-border { border: 2px solid var(--gold); border-radius: 20px; padding: 15px; max-width: 480px; margin: 0 auto; }
        .header-box { text-align: center; margin-bottom: 10px; }
        
        .next-episode { 
            font-size: 22px; 
            font-weight: 900; 
            color: #fff; 
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        
        .round-text {
            font-size: 32px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700;
            margin: 0 0 5px 0;
        }
        
        .status-info { 
            font-size: 11px; 
            color: var(--accent); 
            line-height: 1.5; 
            min-height: 80px;
            width: 100%; 
            background: rgba(255,255,255,0.05); 
            border-radius: 12px; 
            padding: 10px; 
            box-sizing: border-box; 
            margin-top: 8px; 
            text-align: left; 
            border: 1px solid #333; 
        }
        
        .highlight-gold { color: var(--gold); font-weight: bold; }
        .highlight-blue { color: #00ccff; font-weight: bold; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        button { border-radius: 10px; font-weight: bold; cursor: pointer; border: none; height: 50px; transition: 0.2s; }
        .btn-5set { background: linear-gradient(135deg, #00ffcc, #00a884); color: #000; font-size: 16px; }
        .btn-main { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; font-size: 16px; }
        .btn-sub { background: #222; color: #fff; border: 1px solid #444; }
        .btn-reset { grid-column: span 2; background: #333; color: #aaa; height: 40px; margin-top: 5px; }
        
        .row-line { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; }
        .num-container { display: flex; gap: 5px; flex-grow: 1; justify-content: center; }
        
        /* 번호 공 스타일 통일: 검정 배경 + 금색 글씨/테두리 */
        .num-box {
            width: 34px;
            height: 34px;
            line-height: 34px;
            text-align: center;
            font-size: 14px;
            font-weight: 900;
            border-radius: 50%;
            background: #000000 !important;
            color: var(--gold) !important;
            border: 1px solid var(--gold) !important;
        }
        .num-box.fixed,
        .num-box.zero,
        .num-box.normal {
            background: #000000 !important;
            color: var(--gold) !important;
            border: 1px solid var(--gold) !important;
        }
        
        .save-btn { font-size: 11px; background: var(--save); color: white; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .badge { font-size: 10px; background: #333; padding: 2px 6px; border-radius: 10px; margin-left: 5px; color: #aaa; }
        
        /* 팝업 공통 */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .popup-content {
            background: var(--card);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 70vh;
            overflow-y: auto;
            position: relative;
        }
        .popup-close {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: var(--gold);
        }
        .popup-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: var(--gold);
        }
        
        .user-info {
            background: #333;
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
        }
        .change-name-btn {
            background: #00ccff;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 10px;
            margin-left: 5px;
            cursor: pointer;
        }
        
        .small-note {
            margin-top: 3px;
            color: #888;
            font-size: 9px;
            text-align: center;
        }

        /* 클릭 강조색 제거 */
        *:focus, *:active {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 게임센터 스타일 */
        .game-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .game-tab {
            flex: 1;
            background: #222;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 8px 0;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-tab.active {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border-color: var(--accent);
        }
        .game-content {
            min-height: 200px;
            text-align: center;
        }
        .game-btn {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 14px;
            margin: 10px;
            cursor: pointer;
        }
        .game-result {
            font-size: 16px;
            margin-top: 15px;
            color: var(--gold);
        }
        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        .number-cell {
            background: #222;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 8px 0;
            font-size: 14px;
            color: #fff;
        }
        .number-cell.highlight {
            background: var(--gold);
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="outer-border">
    <div class="header-box">
        <div class="next-episode">SHIN-UI-SON + 2번코드</div>
        <div class="round-text">예상 1213회차</div>
        <div id="userDisplay" class="user-info"></div>
        <div id="status" class="status-info">엔진 초기화 중...</div>
    </div>

    <div class="btn-group">
        <button class="btn-5set" onclick="process(5)">5조합 추출</button>
        <button class="btn-main" onclick="process(10)">10조합 추출</button>
        <button class="btn-sub" onclick="openPopup()">보관함</button>
        <button class="btn-sub" onclick="openGameCenter()">🎮 게임센터</button>
        <button class="btn-sub" onclick="clearStorage()">초기화</button>
        <button class="btn-sub btn-reset" onclick="location.reload()">새로고침</button>
    </div>

    <div id="console"></div>
    <div class="small-note">※ 9,10번 조합에 미출수 포함 (최대 4개) | 🎯 1213회차 예상</div>
</div>

<!-- 보관함 팝업 -->
<div id="popup" class="popup-overlay" style="display:none;">
    <div class="popup-content">
        <span class="popup-close" onclick="closePopup()">&times;</span>
        <div class="popup-title">📦 보관함</div>
        <div id="storage"></div>
    </div>
</div>

<!-- 게임센터 팝업 -->
<div id="gamePopup" class="popup-overlay" style="display:none;">
    <div class="popup-content">
        <span class="popup-close" onclick="closeGameCenter()">&times;</span>
        <div class="popup-title">🎮 게임센터</div>
        <div class="game-tabs">
            <button class="game-tab active" data-game="reaction" onclick="switchGame('reaction')">반응속도</button>
            <button class="game-tab" data-game="holzzak" onclick="switchGame('holzzak')">홀짝</button>
            <button class="game-tab" data-game="survival" onclick="switchGame('survival')">숫자생존</button>
        </div>
        <div id="gameContent" class="game-content">
            <!-- 초기 게임 (반응속도) 표시 -->
        </div>
    </div>
</div>

<script>
    // ===== 1213회차 기준 6개 회차 데이터 (1212 + 52주 전 5개) =====
    const FULL_DATA = [
        [1212, 5,8,25,31,41,44,45],   // 이월수 계산용 (1212회)
        [1161, 2,12,20,24,34,42,37],
        [1109, 10,12,13,19,33,40,2],
        [1057, 8,13,19,27,40,45,12],
        [1005, 8,13,18,24,27,29,17],
        [953,  7,9,22,27,37,42,34]
    ];

    // ===== 1번코드 알고리즘 (1213회 기준) =====
    function lottoSystem00001212Final(allData, lastWinning) {
        let dataMap = {};
        allData.forEach(row => dataMap[row[0]] = row);

        const targetRounds = [1161, 1109, 1057, 1005, 953];

        let mainPool = [], bonusPool = [];
        targetRounds.forEach(r => {
            if (dataMap[r]) {
                mainPool.push(...dataMap[r].slice(1, 7));
                bonusPool.push(dataMap[r][7]);
            }
        });

        let survivors = Array.from(new Set([...mainPool, ...bonusPool]));

        let mainFreq = {}, bonusFreq = {};
        mainPool.forEach(n => mainFreq[n] = (mainFreq[n] || 0) + 1);
        bonusPool.forEach(n => bonusFreq[n] = (bonusFreq[n] || 0) + 1);

        let rankedAll = survivors.sort((a, b) => {
            let aInLast = lastWinning.includes(a);
            let bInLast = lastWinning.includes(b);
            if (aInLast && !bInLast) return -1;
            if (!aInLast && bInLast) return 1;
            let aFreq = mainFreq[a] || 0, bFreq = mainFreq[b] || 0;
            if (aFreq > bFreq) return -1;
            if (aFreq < bFreq) return 1;
            return a - b;
        });

        let final17 = rankedAll.slice(0, 13);
        let remaining = rankedAll.slice(13);
        let rebels = remaining.sort((a, b) => {
            let aFreq = bonusFreq[a] || 0, bFreq = bonusFreq[b] || 0;
            if (aFreq > bFreq) return -1;
            if (aFreq < bFreq) return 1;
            return a - b;
        }).slice(0, 4);
        final17.push(...rebels);

        let sections = [[1,10], [11,20], [21,30], [31,40], [41,45]];
        sections.forEach(([start, end]) => {
            if (!final17.some(n => n >= start && n <= end)) {
                let candidates = survivors.filter(n => n >= start && n <= end && !final17.includes(n));
                if (candidates.length) {
                    candidates.sort((a, b) => (bonusFreq[b]||0) - (bonusFreq[a]||0) || a - b);
                    final17.pop();
                    final17.push(candidates[0]);
                }
            }
        });

        return Array.from(new Set(final17)).sort((a, b) => a - b);
    }

    // ===== 전역 변수 =====
    let basket = [], zeroFreqNums = [], machineFixed = [];
    let dynamicAvgSum = 145;
    
    // ===== 이름 관리 기능 =====
    let userName = "";
    let savedNumbers = [];
    
    function updateUserDisplay() {
        const userDisplay = document.getElementById('userDisplay');
        userDisplay.innerHTML = `👤 현재 접속자: ${userName} 
            <button class="change-name-btn" onclick="changeName()">이름변경</button>
            <button class="change-name-btn" style="background:#ff4444;" onclick="deleteUser()">삭제</button>`;
    }
    
    function changeName() {
        const newName = prompt("새로운 이름을 입력하세요:", userName);
        if (newName && newName.trim() !== "") {
            userName = newName.trim();
            localStorage.setItem('lottoUserName', userName);
            
            const storageKey = `lottoSave_${userName}`;
            const localData = localStorage.getItem(storageKey);
            savedNumbers = localData ? JSON.parse(localData) : [];
            
            updateUserDisplay();
            analyze();
            alert(`이름이 ${userName}(으)로 변경되었습니다.`);
        }
    }
    
    function deleteUser() {
        if(confirm(`정말 ${userName}님의 모든 기록을 삭제하시겠습니까?`)) {
            const storageKey = `lottoSave_${userName}`;
            localStorage.removeItem(storageKey);
            
            userName = "guest_" + Math.random().toString(36).substring(2, 6);
            localStorage.setItem('lottoUserName', userName);
            savedNumbers = [];
            
            updateUserDisplay();
            analyze();
            alert(`새로운 손님 계정(${userName})으로 시작합니다.`);
        }
    }

    function initUser() {
        const savedName = localStorage.getItem('lottoUserName');
        
        if (savedName) {
            userName = savedName;
        } else {
            userName = "guest_" + Math.random().toString(36).substring(2, 6);
            localStorage.setItem('lottoUserName', userName);
        }
        
        const storageKey = `lottoSave_${userName}`;
        const localData = localStorage.getItem(storageKey);
        savedNumbers = localData ? JSON.parse(localData) : [];
        
        updateUserDisplay();
        analyze();
    }

    function saveToBox(s) {
        if(!savedNumbers.includes(s)) {
            savedNumbers.push(s);
            const storageKey = `lottoSave_${userName}`;
            localStorage.setItem(storageKey, JSON.stringify(savedNumbers));
            alert(`${userName}님의 보관함에 저장되었습니다.`);
        } else {
            alert("이미 저장된 번호입니다.");
        }
    }

    function deleteSingleItem(index) {
        if(confirm("이 조합을 삭제할까요?")) {
            savedNumbers.splice(index, 1);
            const storageKey = `lottoSave_${userName}`;
            localStorage.setItem(storageKey, JSON.stringify(savedNumbers));
            renderStorage();
        }
    }

    function loadFromStorage(nums) {
        alert(`선택된 번호: ${nums.split(',').join(', ')}`);
        closePopup();
    }

    function renderStorage() {
        const st = document.getElementById('storage');
        if(savedNumbers.length === 0) { 
            st.innerHTML = "<div style='text-align:center; padding:20px; opacity:0.5;'>저장된 조합이 없습니다.</div>"; 
            return; 
        }
        
        st.innerHTML = savedNumbers.map((n, index) => {
            const numbers = n.split(',');
            return `
                <div class="row-line" style="margin-bottom:10px; background:#2a2a2a;">
                    <div class="num-container">
                        ${numbers.map(v=>`<span class="num-box">${v}</span>`).join('')}
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button onclick="loadFromStorage('${n}')" 
                                style="background:#00ccff; color:white; border:none; border-radius:5px; padding:5px 8px; font-size:11px; cursor:pointer;">불러오기</button>
                        <button onclick="deleteSingleItem(${index})" 
                                style="background:#ff4444; color:white; border:none; border-radius:5px; padding:5px 8px; font-size:11px; cursor:pointer;">삭제</button>
                    </div>
                </div>
            `;
        }).join('');
        
        document.querySelector('.popup-title').innerHTML = `📦 ${userName}의 보관함 (${savedNumbers.length}개)`;
    }

    // ===== 통합 분석 함수 (미출수 제거, 기준 합계 5개 회차 평균) =====
    function analyze() {
        let freq22 = {};
        for(let i=1; i<=45; i++) freq22[i] = 0;
        FULL_DATA.forEach(row => {
            for(let j=1; j<=7; j++) {
                if(row[j]) freq22[row[j]]++;
            }
        });
        zeroFreqNums = Object.keys(freq22).filter(n => freq22[n] === 0).map(Number).sort((a,b)=>a-b);

        const lastWinning = FULL_DATA[0].slice(1, 7);
        basket = lottoSystem00001212Final(FULL_DATA, lastWinning);
        machineFixed = basket.slice(0, 3);

        const sumRounds = [1161, 1109, 1057, 1005, 953];
        let sums = [];
        sumRounds.forEach(r => {
            let row = FULL_DATA.find(x => x[0] === r);
            if (row) sums.push(row.slice(1,7).reduce((a,b)=>a+b,0));
        });
        if (sums.length > 0) {
            dynamicAvgSum = Math.round(sums.reduce((a,b)=>a+b,0) / sums.length);
        } else {
            dynamicAvgSum = 145;
        }

        document.getElementById('status').innerHTML = `
            <div><span class="highlight-gold">★ 2번코드 통합 엔진</span></div>
            <div>AI 추천 17수: ${basket.join(', ')}</div>
            <div><span class="highlight-blue">📊 기준 합계 (5회차 평균):</span> ${dynamicAvgSum} (${dynamicAvgSum-25}~${dynamicAvgSum+25})</div>
        `;
    }

    // ===== 조합 생성 함수 =====
    function process(limit) {
        analyze();
        const box = document.getElementById('console');
        box.innerHTML = "";
        let count = 0, used = new Set(), safety = 0;
        let minSum = dynamicAvgSum - 25;
        let maxSum = dynamicAvgSum + 25;

        while(count < limit && safety < 10000) {
            safety++;
            let res = new Set();
            let currentIdx = count + 1;
            let zeroCount = 0;

            if (limit === 10 && (currentIdx === 9 || currentIdx === 10) && zeroFreqNums.length > 0) {
                let availableZeros = [...zeroFreqNums];
                let maxPossible = Math.min(4, availableZeros.length);
                let selectCount = Math.floor(Math.random() * maxPossible) + 1;
                
                for(let i = 0; i < selectCount; i++) {
                    if(availableZeros.length === 0) break;
                    let randomIndex = Math.floor(Math.random() * availableZeros.length);
                    let selectedNum = availableZeros[randomIndex];
                    res.add(selectedNum);
                    zeroCount++;
                    availableZeros.splice(randomIndex, 1);
                }
            } else if (Math.random() > 0.8 && zeroFreqNums.length > 0 && zeroCount < 2) {
                let zeroNum = zeroFreqNums[Math.floor(Math.random() * zeroFreqNums.length)];
                res.add(zeroNum);
                zeroCount++;
            }

            if(limit === 5) res.add(machineFixed[Math.floor(Math.random()*3)]);

            let shuffleBasket = [...basket].sort(() => Math.random() - 0.5);
            for(let n of shuffleBasket) {
                if(res.size >= 6) break;
                
                if(zeroFreqNums.includes(n)) {
                    if(zeroCount < 2) {
                        res.add(n);
                        zeroCount++;
                    }
                } else {
                    res.add(n);
                }
            }

            while(res.size < 6) {
                let rand = Math.floor(Math.random()*45)+1;
                if(zeroFreqNums.includes(rand)) {
                    if(zeroCount < 2) {
                        res.add(rand);
                        zeroCount++;
                    }
                } else {
                    res.add(rand);
                }
            }

            let finalArr = Array.from(res).sort((a,b)=>a-b);
            let sum = finalArr.reduce((a,b)=>a+b, 0);
            let key = finalArr.join(',');

            if(!used.has(key) && sum >= minSum && sum <= maxSum) {
                used.add(key);
                count++;
                let specialMark = (limit === 10 && (count === 9 || count === 10)) ? '🔥' : '';
                renderRow(finalArr, box, key, specialMark);
            }
        }
    }

    function renderRow(arr, target, key, specialMark = '') {
        const html = arr.map(n => `<span class="num-box">${n}</span>`).join('');
        let specialHtml = specialMark ? `<span class="badge">${specialMark}</span>` : '';
        target.innerHTML += `<div class="row-line"><div class="num-container">${html}</div><div style="display: flex; align-items: center;">${specialHtml}<div class="save-btn" onclick="saveToBox('${key}')">저장</div></div></div>`;
    }

    // ===== 보관함 팝업 함수 =====
    function openPopup() {
        document.getElementById('popup').style.display = 'flex';
        renderStorage();
    }

    function closePopup() {
        document.getElementById('popup').style.display = 'none';
    }

    // ===== 게임센터 관련 =====
    let currentGame = 'reaction';
    let gameState = {};

    function openGameCenter() {
        document.getElementById('gamePopup').style.display = 'flex';
        switchGame(currentGame);
    }

    function closeGameCenter() {
        document.getElementById('gamePopup').style.display = 'none';
    }

    function switchGame(game) {
        currentGame = game;
        document.querySelectorAll('.game-tab').forEach(tab => {
            tab.classList.remove('active');
            if(tab.dataset.game === game) tab.classList.add('active');
        });
        renderGame(game);
    }

    function renderGame(game) {
        const content = document.getElementById('gameContent');
        if (game === 'reaction') {
            content.innerHTML = `
                <div style="margin:10px 0;">
                    <p>화면이 초록색으로 바뀌면 클릭하세요!</p>
                    <div id="reactionBox" style="width:100%; height:150px; background:#222; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; transition:0.1s;" onclick="handleReactionClick()">
                        준비되면 시작 버튼을 누르세요
                    </div>
                    <button class="game-btn" onclick="startReaction()">시작</button>
                    <div id="reactionResult" class="game-result"></div>
                </div>
            `;
            gameState.reaction = { state: 'idle', timer: null, startTime: 0 };
        } else if (game === 'holzzak') {
            content.innerHTML = `
                <div style="margin:10px 0;">
                    <p>AI가 선택한 번호가 홀일까요? 짝일까요?</p>
                    <div style="display:flex; gap:10px; justify-content:center;">
                        <button class="game-btn" onclick="guessHolzzak('홀')">홀</button>
                        <button class="game-btn" onclick="guessHolzzak('짝')">짝</button>
                    </div>
                    <div id="holzzakResult" class="game-result"></div>
                </div>
            `;
            gameState.holzzak = { score: 0 };
        } else if (game === 'survival') {
            // 숫자 생존 게임: 1~45 중 랜덤 제거, 마지막까지 남을 숫자 맞히기
            content.innerHTML = `
                <div style="margin:10px 0;">
                    <p>매초 하나씩 숫자가 사라집니다. 마지막까지 남을 숫자를 선택하세요!</p>
                    <div id="survivalGrid" class="number-grid"></div>
                    <button class="game-btn" onclick="startSurvival()">시작</button>
                    <div id="survivalResult" class="game-result"></div>
                </div>
            `;
            gameState.survival = { active: false, numbers: [], target: null, timer: null };
        }
    }

    // ===== 반응속도 게임 =====
    function startReaction() {
        const box = document.getElementById('reactionBox');
        const result = document.getElementById('reactionResult');
        if (!box) return;
        gameState.reaction.state = 'waiting';
        box.style.background = '#222';
        box.innerText = '기다리세요...';
        result.innerText = '';

        const delay = Math.random() * 2000 + 1000; // 1~3초
        gameState.reaction.timer = setTimeout(() => {
            if (gameState.reaction.state === 'waiting') {
                gameState.reaction.state = 'ready';
                box.style.background = '#00aa00';
                box.innerText = '클릭!';
                gameState.reaction.startTime = performance.now();
            }
        }, delay);
    }

    function handleReactionClick() {
        const box = document.getElementById('reactionBox');
        const result = document.getElementById('reactionResult');
        if (!box || !result) return;

        if (gameState.reaction.state === 'ready') {
            const reactionTime = performance.now() - gameState.reaction.startTime;
            result.innerText = `반응속도: ${reactionTime.toFixed(0)}ms`;
            box.style.background = '#222';
            box.innerText = '다시 시작?';
            gameState.reaction.state = 'idle';
            clearTimeout(gameState.reaction.timer);
        } else if (gameState.reaction.state === 'waiting') {
            result.innerText = '너무 빨랐어요! 다시 시작하세요.';
            box.style.background = '#222';
            box.innerText = '준비';
            gameState.reaction.state = 'idle';
            clearTimeout(gameState.reaction.timer);
        }
    }

    // ===== 홀짝 게임 =====
    function guessHolzzak(choice) {
        const resultDiv = document.getElementById('holzzakResult');
        const aiNum = Math.floor(Math.random() * 45) + 1;
        const isOdd = aiNum % 2 === 1;
        const correct = (choice === '홀' && isOdd) || (choice === '짝' && !isOdd);
        if (correct) {
            gameState.holzzak.score++;
            resultDiv.innerHTML = `✅ 정답! (AI 선택: ${aiNum})<br>현재 점수: ${gameState.holzzak.score}`;
        } else {
            gameState.holzzak.score = 0;
            resultDiv.innerHTML = `❌ 틀렸어요! (AI 선택: ${aiNum})<br>점수 초기화. 다시 도전!`;
        }
    }

    // ===== 숫자 생존 게임 =====
    function startSurvival() {
        if (gameState.survival.active) return;
        gameState.survival.active = true;
        // 1~45 배열 생성
        let numbers = Array.from({ length: 45 }, (_, i) => i + 1);
        // 랜덤 셔플
        for (let i = numbers.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
        }
        gameState.survival.numbers = numbers;
        gameState.survival.target = numbers[Math.floor(Math.random() * numbers.length)]; // 정답 (임의로 마지막까지 남을 숫자)
        renderSurvivalGrid();

        // 1초마다 하나씩 제거
        gameState.survival.timer = setInterval(() => {
            if (gameState.survival.numbers.length <= 1) {
                clearInterval(gameState.survival.timer);
                gameState.survival.active = false;
                document.getElementById('survivalResult').innerHTML = `게임 종료! 정답은 ${gameState.survival.target} 였습니다.`;
                return;
            }
            // 랜덤하게 하나 제거 (target이 제거되지 않도록 주의)
            let idx = Math.floor(Math.random() * gameState.survival.numbers.length);
            // target이 제거되지 않도록 보정 (단, numbers.length가 1일 때는 위에서 처리)
            while (gameState.survival.numbers[idx] === gameState.survival.target && gameState.survival.numbers.length > 1) {
                idx = Math.floor(Math.random() * gameState.survival.numbers.length);
            }
            gameState.survival.numbers.splice(idx, 1);
            renderSurvivalGrid();
        }, 1000);
    }

    function renderSurvivalGrid() {
        const grid = document.getElementById('survivalGrid');
        if (!grid) return;
        grid.innerHTML = '';
        gameState.survival.numbers.slice(0, 25).forEach(n => { // 최대 25개만 표시 (화면 제한)
            const cell = document.createElement('div');
            cell.className = 'number-cell';
            cell.innerText = n;
            grid.appendChild(cell);
        });
    }

    // ===== 초기화 및 분석 실행 =====
    window.onload = function() {
        initUser();
    };
</script>
</body>
</html>
