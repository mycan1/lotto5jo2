
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>SHIN-UI-SON - 백테스트 가능 (900~1212)</title>
    <style>
        :root { --gold: #ffd700; --bg: #0b0b0b; --card: #1a1a1a; --accent: #00ffcc; --save: #ff00ff; --danger: #ff4444; }
        body { background-color: var(--bg); color: var(--gold); font-family: 'Malgun Gothic', sans-serif; padding: 10px; margin: 0; }
        .outer-border { border: 2px solid var(--gold); border-radius: 20px; padding: 15px; max-width: 480px; margin: 0 auto; }
        .header-box { text-align: center; margin-bottom: 10px; }
        
        .prev-win-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 2px;
        }
        
        .next-episode { 
            font-size: 22px; 
            font-weight: 900; 
            color: #fff; 
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        
        .round-text {
            font-size: 24px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700;
            margin: 0 0 5px 0;
        }
        
        .base-info {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            align-items: center;
            margin: 8px 0;
        }
        .base-num-box {
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            font-size: 12px;
            font-weight: 900;
            border-radius: 50%;
            background: #000000;
            color: var(--gold);
            border: 1px solid var(--gold);
            display: inline-block;
        }
        .bonus-label {
            color: #888;
            font-size: 10px;
            margin: 0 2px;
        }
        
        .status-info { 
            font-size: 11px; 
            color: var(--accent); 
            line-height: 1.5; 
            min-height: 80px;
            width: 100%; 
            background: rgba(255,255,255,0.05); 
            border-radius: 12px; 
            padding: 10px; 
            box-sizing: border-box; 
            margin-top: 8px; 
            text-align: left; 
            border: 1px solid #333; 
        }
        
        .highlight-gold { color: var(--gold); font-weight: bold; }
        .highlight-blue { color: #00ccff; font-weight: bold; }
        
        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            margin: 15px 0; 
        }
        button { 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            border: none; 
            height: 50px; 
            transition: 0.2s; 
        }
        .btn-5set { background: linear-gradient(135deg, #00ffcc, #00a884); color: #000; font-size: 16px; }
        .btn-main { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; font-size: 16px; }
        .btn-sub { background: #222; color: #fff; border: 1px solid #444; }
        .btn-reset { grid-column: span 2; background: #333; color: #aaa; height: 40px; margin-top: 5px; }
        .btn-review { 
            grid-column: span 2; 
            background: #ff00ff; 
            color: white; 
            font-size: 16px; 
            height: 45px; 
            margin-top: 5px; 
        }
        
        /* 기준 회차 입력 스타일 */
        .base-round-input {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .base-round-input input {
            width: 80px;
            height: 40px;
            text-align: center;
            background: #222;
            border: 1px solid var(--gold);
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
        }
        .base-round-input button {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 5px;
            padding: 0 15px;
            height: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .row-line { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; }
        .num-container { display: flex; gap: 5px; flex-grow: 1; justify-content: center; }
        
        /* 번호 공 스타일 통일: 검정 배경 + 금색 글씨/테두리 */
        .num-box {
            width: 34px;
            height: 34px;
            line-height: 34px;
            text-align: center;
            font-size: 14px;
            font-weight: 900;
            border-radius: 50%;
            background: #000000 !important;
            color: var(--gold) !important;
            border: 1px solid var(--gold) !important;
        }
        .num-box.fixed,
        .num-box.zero,
        .num-box.normal {
            background: #000000 !important;
            color: var(--gold) !important;
            border: 1px solid var(--gold) !important;
        }
        
        .save-btn { font-size: 11px; background: var(--save); color: white; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .badge { font-size: 10px; background: #333; padding: 2px 6px; border-radius: 10px; margin-left: 5px; color: #aaa; }
        
        /* 팝업 공통 */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .popup-content {
            background: var(--card);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 20px;
            max-width: 450px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .popup-close {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 28px;
            background: transparent;
            border: none;
            color: var(--gold);
            cursor: pointer;
            z-index: 1100;
            padding: 5px 10px;
        }
        .popup-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: var(--gold);
        }
        
        .user-info {
            background: #333;
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
        }
        .change-name-btn {
            background: #00ccff;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 10px;
            margin-left: 5px;
            cursor: pointer;
        }
        
        .small-note {
            margin-top: 3px;
            color: #888;
            font-size: 9px;
            text-align: center;
        }

        /* 클릭 강조색 제거 */
        *:focus, *:active {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 게임 전용 스타일 */
        .game-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .game-tab {
            flex: 1;
            background: #222;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 8px 0;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-tab.active {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border-color: var(--accent);
        }
        .game-panel {
            display: none;
        }
        .game-panel.active {
            display: block;
        }
        .game-canvas {
            width: 100%;
            height: 300px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #444;
            margin: 10px 0;
            touch-action: none;
        }
        .selected-numbers {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .selected-ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #000;
            border: 2px solid var(--gold);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }
        .game-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .game-btn {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .game-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .reaction-box {
            width: 100%;
            height: 200px;
            background: #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
        }
        .reaction-result {
            margin-top: 15px;
            font-size: 16px;
            color: var(--gold);
            text-align: center;
        }
        .random-number {
            font-size: 20px;
            margin-top: 10px;
            color: var(--gold);
            text-align: center;
        }

            display: flex;
            gap: 5px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .winning-input input {
            width: 40px;
            height: 40px;
            text-align: center;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
        }
        .result-box {
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
        }
        .match-count {
            font-size: 18px;
            color: var(--gold);
        }
        .combo-item {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border-bottom: 1px solid #333;

<div class="outer-border">
    <div class="header-box">
        <!-- 1212 당첨번호 레이블 + 번호 공 (맨 위) -->
        <div class="prev-win-label" id="prevWinLabel">📌 기준 이전회차 당첨번호</div>
        <div class="base-info" id="baseRoundInfo"></div>
        
        <!-- 그 아래에 기존 내용 -->
        <div class="next-episode">SHIN-UI-SON + 백테스트</div>
        <div class="round-text" id="roundDisplay">예상 회차</div>
        <div id="userDisplay" class="user-info"></div>
        <div id="status" class="status-info">엔진 초기화 중...</div>
    </div>

    <!-- 기준 회차 입력 필드 (게임센터 아래 빈 공간에 배치) -->
    <div class="base-round-input">
        <input type="number" id="baseRoundInput" min="901" max="1300" value="1213" step="1">
        <button onclick="setBaseRound()">회차 설정</button>
    </div>

    <div class="btn-group">
        <button class="btn-5set" onclick="process(5)">5조합 추출</button>
        <button class="btn-main" onclick="process(10)">10조합 추출</button>
        <button class="btn-sub" onclick="openPopup()">보관함</button>
        <button class="btn-sub" onclick="openGamePopup()">🎮 게임센터</button>
        <button class="btn-sub" onclick="clearStorage()">초기화</button>
        <button class="btn-sub btn-reset" onclick="location.reload()">새로고침</button>
        
        <!-- 복기 버튼 -->
        <button class="btn-review" onclick="openReviewPopup()">📊 복기</button>
    </div>

    <div id="console"></div>
    <div class="small-note">※ 9,10번 조합에 미출수 포함 (최대 4개) | 🎯 <span id="targetRound">1213</span>회차 예상</div>
</div>

<!-- 보관함 팝업 -->
<div id="popup" class="popup-overlay" style="display:none;">
    <div class="popup-content">
        <button class="popup-close" onclick="closePopup()">&times;</button>
        <div class="popup-title">📦 보관함</div>
        <div id="storage"></div>
    </div>
</div>

<!-- 게임 팝업 (2개 게임) -->
<div id="gamePopup" class="popup-overlay" style="display:none;">
    <div class="popup-content" style="max-width: 450px;">
        <button class="popup-close" onclick="closeGamePopup()" ontouchstart="event.stopPropagation(); closeGamePopup();">&times;</button>
        <div class="popup-title">🎮 게임센터</div>
        
        <div class="game-tabs">
            <button class="game-tab active" data-game="touch" onclick="switchGame('touch')" ontouchstart="event.stopPropagation(); switchGame('touch');">터치 러쉬</button>
            <button class="game-tab" data-game="reaction" onclick="switchGame('reaction')" ontouchstart="event.stopPropagation(); switchGame('reaction');">반응속도</button>
        </div>

        <div id="touchGame" class="game-panel active">
            <canvas id="gameCanvas" class="game-canvas"></canvas>
            <div class="selected-numbers" id="selectedNumbersContainer"></div>
            <div class="game-btn-group">
                <button class="game-btn" onclick="resetTouchGame()" ontouchstart="event.stopPropagation(); resetTouchGame();">리셋</button>
                <button class="game-btn" id="saveComboBtn" onclick="saveTouchCombo()" ontouchstart="event.stopPropagation(); saveTouchCombo();" disabled>조합 저장</button>
            </div>
        </div>

        <div id="reactionGame" class="game-panel">
            <div style="text-align: center; margin: 20px 0;">
                <div class="reaction-box" id="reactionBox" onclick="handleReactionClick()" ontouchstart="event.stopPropagation(); handleReactionClick();">
                    시작하려면 누르세요
                </div>
                <div class="reaction-result" id="reactionResult"></div>
                <div class="selected-numbers" id="reactionSelectedContainer"></div>
                <div class="game-btn-group">
                    <button class="game-btn" onclick="resetReactionGame()" ontouchstart="event.stopPropagation(); resetReactionGame();">리셋</button>
                    <button class="game-btn" id="saveReactionBtn" onclick="saveReactionCombo()" ontouchstart="event.stopPropagation(); saveReactionCombo();" disabled>조합 저장</button>
                    <button class="game-btn" onclick="startReaction()" ontouchstart="event.stopPropagation(); startReaction();">새 게임</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 복기 팝업 (보너스 포함) -->
<div id="reviewPopup" class="popup-overlay" style="display:none;">
    <div class="popup-content">
        <button class="popup-close" onclick="closeReviewPopup()">&times;</button>
        <div class="popup-title" id="reviewTitle">📊 1213회 복기</div>
        <div style="text-align: center; margin-bottom: 10px;" id="reviewDesc">1213회 당첨번호 6개 + 보너스 번호를 입력하세요</div>
        <div class="winning-input">
            <input type="number" id="win1" min="1" max="45" step="1" placeholder="1">
            <input type="number" id="win2" min="1" max="45" step="1" placeholder="2">
            <input type="number" id="win3" min="1" max="45" step="1" placeholder="3">
            <input type="number" id="win4" min="1" max="45" step="1" placeholder="4">
            <input type="number" id="win5" min="1" max="45" step="1" placeholder="5">
            <input type="number" id="win6" min="1" max="45" step="1" placeholder="6">
        </div>
        <div style="text-align: center; margin: 5px 0;">보너스 번호</div>
        <div class="winning-input">
            <input type="number" id="bonus" min="1" max="45" step="1" placeholder="보너스">
        </div>
        <div style="text-align: center; margin: 10px 0;">
            <button class="game-btn" onclick="compareNumbers()">비교하기</button>
        </div>
        <div id="reviewResult" class="result-box">
            <div>AI 추천 17수와 비교:</div>
            <div id="aiMatch" class="match-count">-</div>
            <div id="aiBonus" style="font-size: 14px; color: #aaa;"></div>
            <div style="margin-top: 10px;">보관함 조합 비교:</div>
            <div id="savedMatch" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>
</div>

    // ===== 분석 함수 (기준 회차 기반) =====
    function analyze() {
        const targetRound = currentBaseRound;
        const prevRound = targetRound - 1;
        
        // 직전 회차 데이터 찾기
        const prevData = FULL_DATA.find(row => row[0] === prevRound);
        if (!prevData) {
            alert(`경고: ${prevRound}회차 데이터가 없습니다.`);
            return;
        }
        const lastWinning = prevData.slice(1, 7);
        
        // 52주 전 5개 회차 계산
        const targetRounds = [];
        for (let i = 1; i <= 5; i++) {
            targetRounds.push(targetRound - 52 * i);
        }
        
        // 데이터 존재 여부 확인
        let mainPool = [], bonusPool = [];
        targetRounds.forEach(r => {
            const row = FULL_DATA.find(x => x[0] === r);
            if (row) {
                mainPool.push(...row.slice(1, 7));
                bonusPool.push(row[7]);
            }
        });
        
        if (mainPool.length === 0) {
            alert('52주 전 회차 데이터가 충분하지 않습니다.');
            return;
        }
        
        let survivors = Array.from(new Set([...mainPool, ...bonusPool]));
        let mainFreq = {}, bonusFreq = {};
        mainPool.forEach(n => mainFreq[n] = (mainFreq[n] || 0) + 1);
        bonusPool.forEach(n => bonusFreq[n] = (bonusFreq[n] || 0) + 1);
        
        let rankedAll = survivors.sort((a, b) => {
            let aInLast = lastWinning.includes(a);
            let bInLast = lastWinning.includes(b);
            if (aInLast && !bInLast) return -1;
            if (!aInLast && bInLast) return 1;
            let aFreq = mainFreq[a] || 0, bFreq = mainFreq[b] || 0;
            if (aFreq > bFreq) return -1;
            if (aFreq < bFreq) return 1;
            return a - b;
        });
        
        let final17 = rankedAll.slice(0, 13);
        let remaining = rankedAll.slice(13);
        let rebels = remaining.sort((a, b) => {
            let aFreq = bonusFreq[a] || 0, bFreq = bonusFreq[b] || 0;
            if (aFreq > bFreq) return -1;
            if (aFreq < bFreq) return 1;
            return a - b;
        }).slice(0, 4);
        final17.push(...rebels);
        
        // 구간 메우기
        let sections = [[1,10], [11,20], [21,30], [31,40], [41,45]];
        sections.forEach(([start, end]) => {
            if (!final17.some(n => n >= start && n <= end)) {
                let candidates = survivors.filter(n => n >= start && n <= end && !final17.includes(n));
                if (candidates.length) {
                    candidates.sort((a, b) => (bonusFreq[b]||0) - (bonusFreq[a]||0) || a - b);
                    final17.pop();
                    final17.push(candidates[0]);
                }
            }
        });
        
        basket = Array.from(new Set(final17)).sort((a, b) => a - b);
        machineFixed = basket.slice(0, 3);
        
        // 기준 합계: 52주 전 5개 회차의 평균
        let sums = [];
        targetRounds.forEach(r => {
            let row = FULL_DATA.find(x => x[0] === r);
            if (row) sums.push(row.slice(1,7).reduce((a,b)=>a+b,0));
        });
        if (sums.length > 0) dynamicAvgSum = Math.round(sums.reduce((a,b)=>a+b,0) / sums.length);
        else dynamicAvgSum = 145;
        
        // 이전회차 당첨번호 표시
        const baseNums = prevData.slice(1, 7);
        const bonus = prevData[7];
        let ballHtml = baseNums.map(n => `<span class="base-num-box">${n}</span>`).join('');
        ballHtml += `<span class="bonus-label">보너스</span>`;
        ballHtml += `<span class="base-num-box">${bonus}</span>`;
        document.getElementById('baseRoundInfo').innerHTML = ballHtml;
        document.getElementById('prevWinLabel').innerHTML = `📌 ${prevRound}회 당첨번호`;
        
        // 화면 업데이트
        document.getElementById('roundDisplay').innerHTML = `예상 ${targetRound}회차`;
        document.getElementById('targetRound').innerText = targetRound;
        document.getElementById('status').innerHTML = `
            <div><span class="highlight-gold">★ 백테스트 엔진</span></div>
            <div>AI 추천 17수: ${basket.join(', ')}</div>
            <div><span class="highlight-blue">📊 기준 합계 (5회차 평균):</span> ${dynamicAvgSum} (${dynamicAvgSum-25}~${dynamicAvgSum+25})</div>
        `;
        
        // 복기 팝업 제목 업데이트
        document.getElementById('reviewTitle').innerHTML = `📊 ${targetRound}회 복기`;
        document.getElementById('reviewDesc').innerHTML = `${targetRound}회 당첨번호 6개 + 보너스 번호를 입력하세요`;
    }

    // ===== 기준 회차 설정 함수 =====
    function setBaseRound() {
        const input = document.getElementById('baseRoundInput').value;
        const round = parseInt(input);
        if (isNaN(round) || round < 901 || round > 1300) {
            alert('901~1300 사이의 회차를 입력하세요.');
            return;
        }
        currentBaseRound = round;
        analyze();
    }

    // ===== 조합 생성 =====
    function process(limit) {
        analyze();
        const box = document.getElementById('console');
        box.innerHTML = "";
        let count = 0, used = new Set(), safety = 0;
        let minSum = dynamicAvgSum - 25;

                let selectCount = Math.floor(Math.random() * maxPossible) + 1;
                for(let i = 0; i < selectCount; i++) {
                    if(availableZeros.length === 0) break;
                    let randomIndex = Math.floor(Math.random() * availableZeros.length);
                    let selectedNum = availableZeros[randomIndex];

                    availableZeros.splice(randomIndex, 1);
                }
            } else if (Math.random() > 0.8 && zeroFreqNums.length > 0 && zeroCount < 2) {
                let zeroNum = zeroFreqNums[Math.floor(Math.random() * zeroFreqNums.length)];
                res.add(zeroNum);
                zeroCount++;
            }
            if(limit === 5) res.add(machineFixed[Math.floor(Math.random()*3)]);
            let shuffleBasket = [...basket].sort(() => Math.random() - 0.5);
            for(let n of shuffleBasket) {
                if(res.size >= 6) break;
                if(zeroFreqNums.includes(n)) {
                    if(zeroCount < 2) {
                        res.add(n);
                        zeroCount++;
                    }
                } else {
                    res.add(n);
                }
            }
            while(res.size < 6) {
                let rand = Math.floor(Math.random()*45)+1;
                if(zeroFreqNums.includes(rand)) {
                    if(zeroCount < 2) {
                        res.add(rand);
                        zeroCount++;
                    }
                } else {
                    res.add(rand);
                }
            }
            let finalArr = Array.from(res).sort((a,b)=>a-b);
            let sum = finalArr.reduce((a,b)=>a+b, 0);
            let key = finalArr.join(',');
            if(!used.has(key) && sum >= minSum && sum <= maxSum) {
                used.add(key);
                count++;
                let specialMark = (limit === 10 && (count === 9 || count === 10)) ? '🔥' : '';
                renderRow(finalArr, box, key, specialMark);
            }
        }
    }
    function renderRow(arr, target, key, specialMark = '') {
        const html = arr.map(n => `<span class="num-box">${n}</span>`).join('');
        let specialHtml = specialMark ? `<span class="badge">${specialMark}</span>` : '';
        target.innerHTML += `<div class="row-line"><div class="num-container">${html}</div><div style="display: flex; align-items: center;">${specialHtml}<div class="save-btn" onclick="saveToBox('${key}')">저장</div></div></div>`;
    }

    // ===== 팝업 함수 =====
    function openPopup() {
        document.getElementById('popup').style.display = 'flex';
        renderStorage();
    }
    function closePopup() {
        document.getElementById('popup').style.display = 'none';
    }
    function clearStorage() {
        if(confirm("보관함을 초기화할까요?")) {
            savedNumbers = [];
            localStorage.removeItem(`lottoSave_${userName}`);
            renderStorage();
        }
    }

    // ===== 게임 관련 변수 =====
    let touchGame = null;
    let touchInterval = null;
    let touchSelected = [];
    let reactionSelected = [];
    let reactionState = 'idle';
    let reactionTimer = null;
    let reactionStartTime = 0;

    function openGamePopup() {
        analyze();
        document.getElementById('gamePopup').style.display = 'flex';
        switchGame('touch');
    }
    function closeGamePopup() {
        document.getElementById('gamePopup').style.display = 'none';
        if (touchInterval) {
            cancelAnimationFrame(touchInterval);
            touchInterval = null;
        }
        clearTimeout(reactionTimer);
    }

    function switchGame(game) {
        document.querySelectorAll('.game-tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.game-panel').forEach(panel => panel.classList.remove('active'));
        if (game === 'touch') {
            document.querySelector('[data-game="touch"]').classList.add('active');
            document.getElementById('touchGame').classList.add('active');
            startTouchGame();
        } else {
            document.querySelector('[data-game="reaction"]').classList.add('active');
            document.getElementById('reactionGame').classList.add('active');
            const box = document.getElementById('reactionBox');
            if (box) {
                box.style.background = '#222';
                box.innerText = '시작하려면 누르세요';
            }
            document.getElementById('reactionResult').innerText = '';
            reactionSelected = [];
            updateReactionSelectedDisplay();
            reactionState = 'idle';
            clearTimeout(reactionTimer);
        }
    }

    // ===== 터치 게임 =====
    function startTouchGame() {
        const canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        touchGame = {
            ctx: canvas.getContext('2d'),
            width: canvas.width,
            height: canvas.height,
            numbers: [],
            highlightSet: new Set(basket)
        };
        for (let i = 1; i <= 45; i++) {
            touchGame.numbers.push({
                num: i,
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3,
                radius: 20
            });
        }
        touchSelected = [];
        updateTouchDisplay();
        if (touchInterval) cancelAnimationFrame(touchInterval);
        touchInterval = requestAnimationFrame(updateTouchGame);
    }
    function updateTouchGame() {
        if (!touchGame) return;
        const ctx = touchGame.ctx;
        const w = touchGame.width;
        const h = touchGame.height;
        ctx.clearRect(0, 0, w, h);
        touchGame.numbers.forEach(num => {
            num.x += num.vx;
            num.y += num.vy;
            if (num.x - num.radius < 0 || num.x + num.radius > w) {
                num.vx *= -1;
                num.x = Math.max(num.radius, Math.min(w - num.radius, num.x));
            }
            if (num.y - num.radius < 0 || num.y + num.radius > h) {
                num.vy *= -1;
                num.y = Math.max(num.radius, Math.min(h - num.radius, num.y));
            }
            ctx.beginPath();
            ctx.arc(num.x, num.y, num.radius, 0, 2 * Math.PI);
            if (touchGame.highlightSet.has(num.num)) {
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 4;
                ctx.fillStyle = '#000000';
            } else {
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.fillStyle = '#000000';
            }
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 14px Malgun Gothic';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(num.num, num.x, num.y);
        });
        touchInterval = requestAnimationFrame(updateTouchGame);
    }
    document.addEventListener('touchstart', (e) => {
        if (!touchGame || document.getElementById('gamePopup').style.display !== 'flex' || !document.getElementById('touchGame').classList.contains('active')) return;
        const canvas = document.getElementById('gameCanvas');
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
        const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
        let touchedNum = null;
        let minDist = Infinity;
        touchGame.numbers.forEach(num => {
            const dx = num.x - x;
            const dy = num.y - y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < num.radius && dist < minDist) {
                minDist = dist;
                touchedNum = num.num;
            }
        });
        if (touchedNum !== null && !touchSelected.includes(touchedNum)) {
            touchSelected.push(touchedNum);
            updateTouchDisplay();
        }
        e.preventDefault();
    }, { passive: false });
    function updateTouchDisplay() {
        const container = document.getElementById('selectedNumbersContainer');
        const html = touchSelected.map(n => `<div class="selected-ball">${n}</div>`).join('');
        container.innerHTML = html || '<div style="color:#666;">터치해서 숫자를 선택하세요</div>';
        const saveBtn = document.getElementById('saveComboBtn');
        saveBtn.disabled = touchSelected.length !== 6;
    }
    function resetTouchGame() {
        if (touchGame) {
            touchGame.numbers.forEach(num => {
                num.x = Math.random() * (touchGame.width - 40) + 20;
                num.y = Math.random() * (touchGame.height - 40) + 20;
                num.vx = (Math.random() - 0.5) * 3;
                num.vy = (Math.random() - 0.5) * 3;
            });
            touchSelected = [];
            updateTouchDisplay();
        }
    }
    function saveTouchCombo() {
        if (touchSelected.length === 6) {
            const sorted = [...touchSelected].sort((a,b)=>a-b);
            const key = sorted.join(',');
            saveToBox(key);
            touchSelected = [];
            updateTouchDisplay();
        }
    }

    // ===== 반응속도 게임 =====
    function updateReactionSelectedDisplay() {
        const container = document.getElementById('reactionSelectedContainer');
        const html = reactionSelected.map(n => `<div class="selected-ball">${n}</div>`).join('');
        container.innerHTML = html || '<div style="color:#666;">터치해서 번호를 뽑으세요</div>';
        const saveBtn = document.getElementById('saveReactionBtn');
        saveBtn.disabled = reactionSelected.length !== 6;
    }

    function startReaction() {
        const box = document.getElementById('reactionBox');
        const result = document.getElementById('reactionResult');
        if (!box) return;
        reactionState = 'waiting';
        box.style.background = '#222';
        box.innerText = '기다리세요...';
        if (result) result.innerText = '';
        const delay = Math.random() * 2000 + 1000;
        clearTimeout(reactionTimer);
        reactionTimer = setTimeout(() => {
            if (reactionState === 'waiting') {
                reactionState = 'ready';
                box.style.background = '#00aa00';
                box.innerText = '터치!';
                reactionStartTime = performance.now();
            }
        }, delay);
    }

    function handleReactionClick() {
        const box = document.getElementById('reactionBox');
        const result = document.getElementById('reactionResult');
        if (!box || !result) return;
        
        if (reactionState === 'ready') {
            const reactionTime = performance.now() - reactionStartTime;
            const randomNum = Math.floor(Math.random() * 45) + 1;
            result.innerText = `반응속도: ${reactionTime.toFixed(0)}ms`;
            
            if (!reactionSelected.includes(randomNum)) {
                reactionSelected.push(randomNum);
                updateReactionSelectedDisplay();
            }
            
            box.style.background = '#222';
            box.innerText = '다시 하려면 새 게임 버튼';
            reactionState = 'idle';
            clearTimeout(reactionTimer);
        } else if (reactionState === 'waiting') {
            result.innerText = '너무 빨랐어요! 다시 시작하세요.';
            box.style.background = '#222';
            box.innerText = '시작 버튼 누르기';
            reactionState = 'idle';
            clearTimeout(reactionTimer);
        }
    }

    function resetReactionGame() {
        reactionSelected = [];
        updateReactionSelectedDisplay();
        startReaction();
    }

    function saveReactionCombo() {
        if (reactionSelected.length === 6) {
            const sorted = [...reactionSelected].sort((a,b)=>a-b);
            const key = sorted.join(',');
            saveToBox(key);
            reactionSelected = [];
            updateReactionSelectedDisplay();
            startReaction();
        }
    }

    // ===== 복기 팝업 함수 =====
    function openReviewPopup() {
        analyze(); // 최신 basket 갱신
        // 입력 필드 초기화
        document.getElementById('win1').value = '';
        document.getElementById('win2').value = '';
        document.getElementById('win3').value = '';
        document.getElementById('win4').value = '';
        document.getElementById('win5').value = '';
        document.getElementById('win6').value = '';
        document.getElementById('bonus').value = '';
        document.getElementById('aiMatch').innerText = '-';
        document.getElementById('aiBonus').innerText = '';
        document.getElementById('savedMatch').innerHTML = '';
        document.getElementById('reviewPopup').style.display = 'flex';
    }

    function closeReviewPopup() {
        document.getElementById('reviewPopup').style.display = 'none';
    }

    function compareNumbers() {
        const win = [
            parseInt(document.getElementById('win1').value),
            parseInt(document.getElementById('win2').value),
            parseInt(document.getElementById('win3').value),
            parseInt(document.getElementById('win4').value),
            parseInt(document.getElementById('win5').value),
            parseInt(document.getElementById('win6').value)
        ];
        const bonus = parseInt(document.getElementById('bonus').value);

        if (win.some(isNaN) || isNaN(bonus)) {
            alert('모든 번호를 입력해주세요.');
            return;
        }
        if (new Set(win).size !== 6) {
            alert('당첨번호는 중복 없이 6개를 입력해야 합니다.');
            return;
        }

        const winSet = new Set(win);

        const aiMatchCount = basket.filter(n => winSet.has(n)).length;
        const aiBonusMatch = basket.includes(bonus);
        document.getElementById('aiMatch').innerText = `${aiMatchCount}개 일치`;
        document.getElementById('aiBonus').innerHTML = aiBonusMatch ? '(보너스 번호 포함)' : '';

        const savedDiv = document.getElementById('savedMatch');
        if (savedNumbers.length === 0) {
            savedDiv.innerHTML = '저장된 조합이 없습니다.';
        } else {
            let html = '';
            savedNumbers.forEach(combo => {
                const nums = combo.split(',').map(Number);
                const matchCount = nums.filter(n => winSet.has(n)).length;
                const hasBonus = nums.includes(bonus);
                let rankInfo = '';
                if (matchCount === 6) rankInfo = '🥇 1등';
                else if (matchCount === 5 && hasBonus) rankInfo = '🥈 2등';
                else if (matchCount === 5) rankInfo = '🥉 3등';
                else if (matchCount === 4) rankInfo = '4등';
                else if (matchCount === 3) rankInfo = '5등';
                else rankInfo = '낙첨';

                html += `<div class="combo-item"><span>${combo}</span><span>${matchCount}개 ${rankInfo}</span></div>`;
            });
            savedDiv.innerHTML = html;
        }
    }

    window.onload = function() {
        initUser();
        setBaseRound(); // 기본 회차(1213)로 분석 실행
    };
</script>
