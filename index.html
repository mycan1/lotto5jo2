<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIN-UI-SON v21.8 - BONUS INCLUDED</title>
    <style>
        :root { --gold: #ffd700; --bg: #0b0b0b; --card: #1a1a1a; --accent: #00ffcc; --save: #ff00ff; --danger: #ff4444; }
        body { background-color: var(--bg); color: var(--gold); font-family: 'Malgun Gothic', sans-serif; padding: 10px; margin: 0; }
        .outer-border { border: 2px solid var(--gold); border-radius: 20px; padding: 15px; max-width: 480px; margin: 0 auto; box-sizing: border-box; }
        .header-box { text-align: center; margin-bottom: 10px; }
        .next-episode { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .status-info { font-size: 13px; color: #fff; line-height: 1.6; width: 100%; background: rgba(255,255,255,0.07); border-radius: 12px; padding: 15px; box-sizing: border-box; margin-top: 10px; text-align: left; border: 1px solid #444; }
        .highlight-gold { color: var(--gold); font-weight: bold; }
        .highlight-red { color: #fff; font-weight: 900; font-size: 14px; background: #b30000; padding: 2px 6px; border-radius: 4px; display: inline-block; margin: 2px; }
        .basket-box { margin: 8px 0; padding: 10px; background: rgba(0, 255, 204, 0.1); border-radius: 8px; border: 1px solid var(--accent); }
        .seed-box { margin-top: 8px; border-top: 1px dashed #555; padding-top: 8px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        button { border-radius: 10px; font-weight: bold; cursor: pointer; border: none; height: 50px; }
        .btn-5set { background: linear-gradient(135deg, #00ffcc, #00a884); color: #000; }
        .btn-main { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; }
        .btn-sub { background: #222; color: #fff; border: 1px solid #444; }
        .row-line { background: var(--card); border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; }
        .num-container { display: flex; gap: 4px; flex-grow: 1; justify-content: center; flex-wrap: wrap; }
        .num-box { width: 32px; height: 32px; line-height: 32px; text-align: center; font-size: 13px; font-weight: 900; border-radius: 50%; color: #fff; }
        .fixed { background: linear-gradient(135deg, #00ffcc, #00a884); color: #000; } 
        .zero { background: linear-gradient(135deg, #ff4444, #b30000); } 
        .normal { background: #444; border: 1px solid var(--gold); }
    </style>
</head>
<body>

<div class="outer-border">
    <div class="header-box">
        <span class="next-episode">SHIN-UI-SON v21.8</span>
        <div id="status" class="status-info">데이터 분석 중...</div>
    </div>

    <div class="btn-group">
        <button class="btn-5set" onclick="process(5)">5조합 추출</button>
        <button class="btn-main" onclick="process(10)">10조합 추출</button>
        <button class="btn-sub" onclick="location.reload()">새로고침</button>
        <button class="btn-sub" onclick="alert('보관함 기능은 추출 후 이용하세요')">보관함</button>
    </div>

    <div id="console"></div>
</div>

<script>
    // 23회차 데이터 (번호 6개 + 보너스 번호 1개 포함 구조)
    const FULL_DATA = [
        [1211,23,26,27,35,38,40,10],[1210,1,7,9,17,27,38,31],[1209,2,17,20,35,37,39,24],
        [1208,6,27,30,36,38,42,25],[1207,10,22,24,27,38,45,11],[1206,1,3,17,26,27,42,23],
        [1205,1,4,16,23,31,41,2],[1204,8,16,28,30,31,44,27],[1203,3,6,18,29,35,39,24],
        [1202,5,12,21,33,37,40,7],[1201,7,9,24,27,35,36,37],[1200,1,2,4,16,20,32,45],
        [1199,16,24,25,30,31,32,7],[1198,26,30,33,38,39,41,21],[1197,1,5,7,26,28,43,30],
        [1196,8,12,15,29,40,45,14],[1195,3,15,27,33,34,36,37],[1194,3,13,15,24,33,37,2],
        [1193,6,9,16,19,24,28,17],[1192,10,16,23,36,39,40,11],[1191,1,4,11,12,20,41,2],
        [1190,7,9,19,23,26,45,33],[1189,9,19,29,35,37,38,31]
    ];

    let basket = [], zeroFreqNums = [], machineFixed = [];

    function analyze() {
        let appearance = new Set();
        let freq = {};
        for(let n=1; n<=45; n++) freq[n] = 0;

        // 보너스 번호(index 7) 포함 전수 분석
        FULL_DATA.forEach(row => {
            for(let i=1; i<=7; i++) { // 1번부터 7번(보너스)까지
                let num = row[i];
                if(num) {
                    appearance.add(num);
                    freq[num]++;
                }
            }
        });

        // 보너스 포함 미출수 계산
        zeroFreqNums = [];
        for(let n=1; n<=45; n++) {
            if(!appearance.has(n)) zeroFreqNums.push(n);
        }
        zeroFreqNums.sort((a,b)=>a-b);

        // 상위 빈도 15수 추출
        let scored = Object.keys(freq).map(Number).sort((a,b) => freq[b] - freq[a]);
        basket = scored.slice(0, 15);
        machineFixed = scored.slice(0, 3); 

        document.getElementById('status').innerHTML = `
            <div style="margin-bottom:8px;"><span class="highlight-gold">★ 알고리즘: v21.8 (보너스 포함 23회 분석)</span></div>
            <div class="basket-box">
                <span class="highlight-gold">추천 15수 (보너스 빈도 포함):</span><br>
                <span style="color:var(--accent); font-weight:bold;">${basket.join(', ')}</span>
            </div>
            <div class="seed-box">
                <span style="color:#ff6b6b; font-weight:bold;">23회간 무출현 (보너스 포함):</span><br>
                <div style="margin-top:5px;">${zeroFreqNums.map(n => `<span class="highlight-red">${n}</span>`).join(' ') || '없음'}</div>
            </div>`;
    }

    function process(limit) {
        analyze();
        const box = document.getElementById('console');
        box.innerHTML = "";
        let count = 0, safety = 0;

        while(count < limit && safety < 5000) {
            safety++;
            let res = new Set();
            
            // 9, 10번 조합 미출수 배치 로직
            if (limit === 10 && count >= 8 && zeroFreqNums.length > 0) {
                res.add(zeroFreqNums[Math.floor(Math.random() * zeroFreqNums.length)]);
            } else {
                res.add(machineFixed[Math.floor(Math.random() * machineFixed.length)]);
            }

            let tempBasket = [...basket].sort(() => Math.random() - 0.5);
            for(let n of tempBasket) { if(res.size < 6) res.add(n); }
            while(res.size < 6) res.add(Math.floor(Math.random()*45)+1);

            let finalArr = Array.from(res).sort((a,b)=>a-b);
            let sum = finalArr.reduce((a,b)=>a+b, 0);

            // 필터: 합계 90~180
            if(sum >= 90 && sum <= 180) {
                count++;
                renderRow(finalArr, box, count);
            }
        }
    }

    function renderRow(arr, target, idx) {
        const html = arr.map(n => {
            let cls = zeroFreqNums.includes(n) ? "zero" : (machineFixed.includes(n) ? "fixed" : "normal");
            return `<span class="num-box ${cls}">${n}</span>`;
        }).join('');
        target.innerHTML += `
            <div class="row-line">
                <span style="font-size:11px; color:#888; width:20px;">${idx}</span>
                <div class="num-container">${html}</div>
            </div>`;
    }

    window.onload = analyze;
</script>
</body>
</html>
