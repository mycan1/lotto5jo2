<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIN-UI-SON v21.9</title>
    <style>
        :root { --gold: #ffd700; --bg: #0b0b0b; --card: #1a1a1a; --accent: #00ffcc; --save: #ff00ff; }
        body { background-color: var(--bg); color: var(--gold); font-family: 'Malgun Gothic', sans-serif; padding: 10px; margin: 0; }
        .outer-border { border: 2px solid var(--gold); border-radius: 20px; padding: 15px; max-width: 480px; margin: 0 auto; box-sizing: border-box; }
        
        /* [미출수 전용 창] - 이거 무조건 먼저 채웁니다 */
        .zero-box { border: 3px solid #ff4444; background: rgba(255, 0, 0, 0.1); border-radius: 15px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .zero-title { color: #ff4444; font-weight: 900; font-size: 16px; margin-bottom: 10px; }
        .ball-red { color: #fff; font-weight: 900; background: #ff0000; padding: 4px 8px; border-radius: 5px; display: inline-block; margin: 3px; border: 2px solid #fff; box-shadow: 0 0 5px #ff0000; }

        .status-box { font-size: 14px; color: #fff; background: #222; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #444; text-align: center; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        button { border-radius: 10px; font-weight: bold; cursor: pointer; border: none; height: 55px; font-size: 16px; }
        .btn-extract { background: #ffd700; color: #000; }
        .btn-save-check { background: #ff00ff; color: #fff; } 
        .btn-refresh { background: #333; color: #fff; border: 1px solid #666; }

        .row-line { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; cursor: pointer; }
        .num-container { display: flex; gap: 5px; flex-grow: 1; justify-content: center; flex-wrap: wrap; }
        .num-box { width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 15px; font-weight: 900; border-radius: 50%; color: #fff; }
        .zero-ball { background: #ff0000 !important; border: 2px solid #fff; } 
        .fixed-ball { background: #00ffcc; color: #000; }
        .normal-ball { background: #444; border: 1px solid var(--gold); }
    </style>
</head>
<body>

<div class="outer-border">
    <div style="text-align:center; margin-bottom:15px;"><span style="font-size:26px; font-weight:900; color:#fff;">SHIN-UI-SON v21.9</span></div>

    <div class="zero-box">
        <div class="zero-title">[23회차 보너스포함 미출수 리스트]</div>
        <div id="zero_window">계산 중...</div>
    </div>

    <div id="status_window" class="status-box">데이터 로딩 중...</div>

    <div class="btn-grid">
        <button class="btn-extract" onclick="extract(5)" style="background:#00ffcc;">5조합 추출</button>
        <button class="btn-extract" onclick="extract(10)">10조합 추출</button>
        <button class="btn-save-check" onclick="viewStorage()">보관함 확인</button>
        <button class="btn-refresh" onclick="location.reload()">새로고침</button>
    </div>

    <div id="display_area"></div>
</div>

<script>
    const RAW_DATA = [[1211,23,26,27,35,38,40,10],[1210,1,7,9,17,27,38,31],[1209,2,17,20,35,37,39,24],[1208,6,27,30,36,38,42,25],[1207,10,22,24,27,38,45,11],[1206,1,3,17,26,27,42,23],[1205,1,4,16,23,31,41,2],[1204,8,16,28,30,31,44,27],[1203,3,6,18,29,35,39,24],[1202,5,12,21,33,37,40,7],[1201,7,9,24,27,35,36,37],[1200,1,2,4,16,20,32,45],[1199,16,24,25,30,31,32,7],[1198,26,30,33,38,39,41,21],[1197,1,5,7,26,28,43,30],[1196,8,12,15,29,40,45,14],[1195,3,15,27,33,34,36,37],[1194,3,13,15,24,33,37,2],[1193,6,9,16,19,24,28,17],[1192,10,16,23,36,39,40,11],[1191,1,4,11,12,20,41,2],[1190,7,9,19,23,26,45,33],[1189,9,19,29,35,37,38,31]];

    let g_zeros = [], g_basket = [], g_fixed = [], g_storage = [];

    // 제가 만든 미출수 합집합 로직 그대로 실행합니다.
    function start() {
        let allSeen = new Set();
        let f = {};
        for(let n=1; n<=45; n++) f[n] = 0;

        // 23회차 다 쏟아붓기
        RAW_DATA.forEach(r => {
            for(let i=1; i<=7; i++) { if(r[i]) { allSeen.add(r[i]); f[r[i]]++; } }
        });

        // 미출수 (없는 놈들)
        g_zeros = [];
        for(let n=1; n<=45; n++) { if(!allSeen.has(n)) g_zeros.push(n); }
        g_zeros.sort((a,b)=>a-b);

        // 상단 빨간 창에 미출수 강제 출력
        document.getElementById('zero_window').innerHTML = g_zeros.map(n => `<span class="ball-red">${n}</span>`).join('');
        
        // 15수 세팅
        let s = Object.keys(f).map(Number).sort((a,b) => f[b] - f[a]);
        g_basket = s.slice(0, 15);
        g_fixed = s.slice(0, 3);
        document.getElementById('status_window').innerHTML = `추천 15수: [${g_basket.join(', ')}]`;
    }

    function extract(limit) {
        const area = document.getElementById('display_area');
        area.innerHTML = "";
        let count = 0;
        while(count < limit) {
            let res = new Set();
            if (count >= 8 && g_zeros.length > 0) {
                res.add(g_zeros[Math.floor(Math.random() * g_zeros.length)]);
            } else {
                res.add(g_fixed[Math.floor(Math.random() * g_fixed.length)]);
            }
            let shuf = [...g_basket].sort(() => Math.random() - 0.5);
            for(let n of shuf) { if(res.size < 6) res.add(n); }
            while(res.size < 6) res.add(Math.floor(Math.random()*45)+1);

            let arr = Array.from(res).sort((a,b)=>a-b);
            let sum = arr.reduce((a,b)=>a+b, 0);
            if(sum >= 80 && sum <= 200) {
                count++;
                let row = document.createElement('div');
                row.className = 'row-line';
                row.onclick = () => { g_storage.push([...arr]); alert("저장!"); };
                let h = `<span style="font-size:12px; color:#888;">${count}</span><div class="num-container">`;
                arr.forEach(n => {
                    let c = g_zeros.includes(n) ? "zero-ball" : (g_fixed.includes(n) ? "fixed-ball" : "normal-ball");
                    h += `<span class="num-box ${c}">${n}</span>`;
                });
                row.innerHTML = h + `</div>`;
                area.appendChild(row);
            }
        }
    }

    function viewStorage() {
        if(g_storage.length === 0) return alert("비었음");
        alert(g_storage.map((a,i) => `${i+1}: ${a.join(', ')}`).join('\n'));
    }

    window.onload = start;
</script>
</body>
</html>
