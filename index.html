<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1211회차 미출수 분석기</title>
    <style>
        :root { --gold: #fbc02d; --bg: #121212; --card: #1e1e1e; --white: #eceff1; }
        body { background: var(--bg); color: var(--white); font-family: sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 15px; margin-bottom: 20px; }
        
        .refresh-btn { 
            width: 100%; padding: 18px; background: var(--gold); border: none; border-radius: 8px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-bottom: 20px;
        }

        table { width: 100%; background: var(--card); border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        th { background: #333; color: var(--gold); padding: 12px; font-size: 0.9rem; }
        td { border-bottom: 1px solid #333; padding: 15px 5px; text-align: center; }

        .ball-row { display: flex; justify-content: center; gap: 5px; }
        .ball { 
            width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; font-size: 0.9rem; background: #444; color: white;
        }
        
        /* [중요] 미출수는 무조건 빨간색 */
        .ball.missing { 
            background: #ff0000; 
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.8); 
            border: 2px solid #fff; 
        } 
        /* 다출수는 파란색 */
        .ball.hot { background: #007bff; }

        .storage { margin-top: 25px; background: #000; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        #storageList { line-height: 1.8; color: #ccc; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="color:var(--gold);">1211회 분석 (미출수1+다출수2)</h1>
        <p id="missingInfo" style="color:#ff4444; font-weight:bold;"></p>
    </div>

    <button class="refresh-btn" onclick="generate()">♻️ 새 조합 뽑기 (미출수 포함)</button>

    <table>
        <thead>
            <tr>
                <th width="15%">순번</th>
                <th>조합 (빨간공 = 미출수)</th>
                <th width="15%">저장</th>
            </tr>
        </thead>
        <tbody id="combiBody"></tbody>
    </table>

    <div class="storage">
        <strong>📌 저장된 마킹 번호</strong>
        <div id="storageList"></div>
    </div>
</div>

<script>
    // 30회차 데이터 (모든 오타 쉼표로 수정 완료)
    const DATA = [
        [1210,1,7,9,17,27,38,31],[1209,2,17,20,35,37,39,24],[1208,6,27,30,36,38,42,25],
        [1207,10,22,24,27,38,45,11],[1206,1,3,17,26,27,42,23],[1205,1,4,16,23,31,41,2],
        [1204,8,16,28,30,31,44,27],[1203,3,6,18,29,35,39,24],[1202,5,12,21,33,37,40,7],
        [1201,7,9,24,27,35,36,37],[1200,1,2,4,16,20,32,45],[1199,16,24,25,30,31,32,7],
        [1198,26,30,33,38,39,41,21],[1197,1,5,7,26,28,43,30],[1196,8,12,15,29,40,45,14],
        [1195,3,15,27,33,34,36,37],[1194,3,13,15,24,33,37,2],[1193,6,9,16,19,24,28,17],
        [1192,10,16,23,36,39,40,11],[1191,1,4,11,12,20,41,2],[1190,7,9,19,23,26,45,33],
        [1189,9,19,29,35,37,38,31],[1188,3,4,12,19,22,27,9],[1187,5,13,26,29,37,40,42],
        [1186,2,8,13,16,23,28,35],[1185,6,17,22,28,29,32,38],[1184,14,16,23,25,31,37,42],
        [1183,4,15,17,23,27,36,31],[1182,1,13,21,25,28,31,22],[1181,8,10,14,20,33,41,28]
    ];

    const counts = {};
    const appeared = new Set();
    DATA.forEach(row => { row.slice(1, 7).forEach(n => { counts[n] = (counts[n] || 0) + 1; appeared.add(n); }); });
    
    // 미출수 (1~45 중 30회 동안 안 나온 수)
    const missingNums = Array.from({length: 45}, (_, i) => i + 1).filter(n => !appeared.has(n));
    // 다출수 상위 12개
    const hotNums = Object.keys(counts).sort((a,b) => counts[b] - counts[a]).slice(0, 12).map(Number);

    document.getElementById('missingInfo').innerText = `현재 미출수: ${missingNums.join(', ')}`;

    function getAC(nums) {
        const diff = new Set();
        for(let i=0; i<6; i++) for(let j=i+1; j<6; j++) diff.add(Math.abs(nums[i]-nums[j]));
        return diff.size - 5;
    }

    function generate() {
        const body = document.getElementById('combiBody');
        body.innerHTML = '';
        let valid = 0;

        while(valid < 10) {
            let res = new Set();
            // 1. 미출수 1개 (빨간공)
            res.add(missingNums[Math.floor(Math.random()*missingNums.length)]);
            // 2. 다출수 2개 (파란공)
            while(res.size < 3) res.add(hotNums[Math.floor(Math.random()*hotNums.length)]);
            // 3. 나머지 랜덤 3개
            while(res.size < 6) res.add(Math.floor(Math.random()*45)+1);

            let sorted = Array.from(res).sort((a,b) => a-b);
            
            // 필터링
            if(getAC(sorted) < 6) continue;
            let odds = sorted.filter(n => n%2!==0).length;
            if(odds === 0 || odds === 6) continue;

            valid++;
            let tr = document.createElement('tr');
            let ballsHtml = sorted.map(n => {
                let cls = missingNums.includes(n) ? 'missing' : (hotNums.includes(n) ? 'hot' : '');
                return `<div class="ball ${cls}">${n}</div>`;
            }).join('');

            tr.innerHTML = `<td>${valid}</td><td><div class="ball-row">${ballsHtml}</div></td><td><button onclick="save('${sorted.join(', ')}')">저장</button></td>`;
            body.appendChild(tr);
        }
    }

    let saved = [];
    function save(s) {
        if(saved.length >= 10) saved.shift();
        saved.push(s);
        document.getElementById('storageList').innerHTML = saved.map(n => `<div>✅ ${n}</div>`).reverse().join('');
    }

    generate();
</script>
</body>
</html>
