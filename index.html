<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIN-UI-SON v21.9</title>
    <style>
        :root { --gold: #ffd700; --bg: #0b0b0b; --card: #1a1a1a; --accent: #00ffcc; --save: #ff00ff; }
        body { background-color: var(--bg); color: var(--gold); font-family: 'Malgun Gothic', sans-serif; padding: 10px; margin: 0; }
        .outer-border { border: 2px solid var(--gold); border-radius: 20px; padding: 15px; max-width: 480px; margin: 0 auto; box-sizing: border-box; }
        
        /* [사용자 캡처 기준] 미출수 전용 독립 창 */
        .zero-window { 
            border: 3px solid #ff4444; 
            background: rgba(255, 0, 0, 0.1); 
            border-radius: 15px; 
            padding: 15px; 
            margin-bottom: 15px; 
            text-align: center; 
        }
        .zero-title { color: #ff4444; font-weight: 900; font-size: 16px; margin-bottom: 10px; }
        .highlight-red { color: #fff !important; font-weight: 900; background: #ff0000; padding: 4px 8px; border-radius: 5px; display: inline-block; margin: 3px; border: 2px solid #fff; }

        /* 추천 15수 표시창 */
        .status-info { font-size: 14px; color: #fff; background: #222; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #444; text-align: center; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        button { border-radius: 10px; font-weight: bold; cursor: pointer; border: none; height: 55px; font-size: 16px; }
        .btn-5set { background: #00ffcc; color: #000; }
        .btn-main { background: #ffd700; color: #000; }
        .btn-save { background: #ff00ff; color: #fff; } /* 보관함 확인 버튼 */
        .btn-sub { background: #333; color: #fff; border: 1px solid #666; }

        .row-line { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; cursor: pointer; }
        .num-container { display: flex; gap: 5px; flex-grow: 1; justify-content: center; flex-wrap: wrap; }
        .num-box { width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 15px; font-weight: 900; border-radius: 50%; color: #fff; }
        .zero { background: #ff0000 !important; border: 2px solid #fff; } 
        .fixed { background: #00ffcc; color: #000; }
        .normal { background: #444; border: 1px solid var(--gold); }
    </style>
</head>
<body>

<div class="outer-border">
    <div style="text-align:center; margin-bottom:15px;"><span style="font-size:26px; font-weight:900; color:#fff;">SHIN-UI-SON v21.9</span></div>

    <div class="zero-window">
        <div class="zero-title">[23회차 보너스포함 미출수 리스트]</div>
        <div id="zero_list" style="color:#fff;">데이터 합집합 계산 중...</div>
    </div>

    <div id="status" class="status-info">분석 대기 중...</div>

    <div class="btn-group">
        <button class="btn-5set" onclick="process(5)">5조합 추출</button>
        <button class="btn-main" onclick="process(10)">10조합 추출</button>
        <button class="btn-save" onclick="showStorage()">보관함 확인</button>
        <button class="btn-sub" onclick="location.reload()">새로고침</button>
    </div>

    <div id="console"></div>
</div>

<script>
    const FULL_DATA = [
        [1211,23,26,27,35,38,40,10],[1210,1,7,9,17,27,38,31],[1209,2,17,20,35,37,39,24],
        [1208,6,27,30,36,38,42,25],[1207,10,22,24,27,38,45,11],[1206,1,3,17,26,27,42,23],
        [1205,1,4,16,23,31,41,2],[1204,8,16,28,30,31,44,27],[1203,3,6,18,29,35,39,24],
        [1202,5,12,21,33,37,40,7],[1201,7,9,24,27,35,36,37],[1200,1,2,4,16,20,32,45],
        [1199,16,24,25,30,31,32,7],[1198,26,30,33,38,39,41,21],[1197,1,5,7,26,28,43,30],
        [1196,8,12,15,29,40,45,14],[1195,3,15,27,33,34,36,37],[1194,3,13,15,24,33,37,2],
        [1193,6,9,16,19,24,28,17],[1192,10,16,23,36,39,40,11],[1191,1,4,11,12,20,41,2],
        [1190,7,9,19,23,26,45,33],[1189,9,19,29,35,37,38,31]
    ];

    let g_zeros = [], g_basket = [], g_fixed = [], storage = [];

    // [이중 구조] 페이지 로딩 즉시 미출수부터 합집합해서 전용 창에 표시
    function init() {
        let allNumbers = new Set();
        let freq = {};
        for(let n=1; n<=45; n++) freq[n] = 0;

        // 23회차 다 모아서 합집합 (보너스 포함)
        FULL_DATA.forEach(row => {
            for(let i=1; i<=7; i++) { 
                if(row[i]) { allNumbers.add(row[i]); freq[row[i]]++; }
            }
        });

        // 미출수 추출
        g_zeros = [];
        for(let n=1; n<=45; n++) { if(!allNumbers.has(n)) g_zeros.push(n); }
        g_zeros.sort((a,b)=>a-b);

        // 추천 15수 상위 컷오프
        let sorted = Object.keys(freq).map(Number).sort((a,b) => freq[b] - freq[a]);
        g_basket = sorted.slice(0, 15);
        g_fixed = sorted.slice(0, 3);

        // [사용자 요청] 전용 창에 미출수 먼저 뿌리기
        document.getElementById('zero_list').innerHTML = g_zeros.map(n => `<span class="highlight-red">${n}</span>`).join('');
        document.getElementById('status').innerHTML = `분석 완료: 추천 15수 [${g_basket.join(', ')}]`;
    }

    function process(limit) {
        const box = document.getElementById('console');
        box.innerHTML = `<p style="font-size:12px; color:#888; text-align:center; margin-bottom:10px;">번호를 클릭하면 보관함에 저장됩니다.</p>`;
        let count = 0;

        while(count < limit) {
            let res = new Set();
            // 9, 10번 조합 미출수 포함 로직
            if (count >= 8 && g_zeros.length > 0) {
                res.add(g_zeros[Math.floor(Math.random() * g_zeros.length)]);
            } else {
                res.add(g_fixed[Math.floor(Math.random() * g_fixed.length)]);
            }

            let temp = [...g_basket].sort(() => Math.random() - 0.5);
            for(let n of temp) { if(res.size < 6) res.add(n); }
            while(res.size < 6) res.add(Math.floor(Math.random()*45)+1);

            let finalArr = Array.from(res).sort((a,b)=>a-b);
            let sum = finalArr.reduce((a,b)=>a+b, 0);

            if(sum >= 80 && sum <= 200) {
                count++;
                renderRow(finalArr, box, count);
            }
        }
    }

    function renderRow(arr, target, idx) {
        const row = document.createElement('div');
        row.className = 'row-line';
        row.onclick = () => { 
            storage.push([...arr]); 
            alert(arr.join(', ') + " 보관함 저장!"); 
        };
        
        let html = `<span style="font-size:12px; color:#888;">${idx}</span><div class="num-container">`;
        arr.forEach(n => {
            let cls = g_zeros.includes(n) ? "zero" : (g_fixed.includes(n) ? "fixed" : "normal");
            html += `<span class="num-box ${cls}">${n}</span>`;
        });
        html += `</div>`;
        row.innerHTML = html;
        target.appendChild(row);
    }

    function showStorage() {
        if(storage.length === 0) return alert("보관함이 비어있습니다.");
        alert("--- 저장된 번호 리스트 ---\n" + storage.map((a,i) => `${i+1}번: ${a.join(', ')}`).join('\n'));
    }

    window.onload = init;
</script>
</body>
</html>
