<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신의 손 - 1211회차 최종 병기</title>
    <style>
        /* 사장님 스타일: 블랙 & 골드 디자인 */
        body { background-color: #0c0c0c; color: #f2c94c; font-family: 'Malgun Gothic', sans-serif; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #f2c94c; font-size: 2.5rem; margin-top: 20px; font-weight: bold; letter-spacing: -1px; cursor: pointer; text-shadow: 0 0 15px rgba(242, 201, 76, 0.5); }
        .target-box { color: #FFF; font-size: 1.1rem; margin-bottom: 25px; background: #1a1a1a; padding: 12px 20px; border-radius: 10px; border: 2px solid #f2c94c; display: inline-block; font-weight: bold; }
        
        /* 버튼 디자인 */
        .btn-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 400px; margin: 0 auto 15px auto; }
        button { border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.2s; position: relative; box-shadow: 0 4px 0 #8a6d10; }
        button:active { transform: translateY(3px); box-shadow: none; }
        .btn-main { width: 100%; height: 65px; background-color: #d4a017; color: black; border: 1px solid #f2c94c; }
        
        /* 분석 결과 출력창 */
        #console { width: 100%; max-width: 420px; height: 520px; margin: 0 auto; background-color: #1a1a1a; border-radius: 15px; border: 3px solid #333; padding: 20px; text-align: left; overflow-y: auto; color: #f2c94c; font-size: 15px; line-height: 1.8; white-space: pre-wrap; box-sizing: border-box; font-family: 'Consolas', monospace; border-left: 6px solid #f2c94c; }
        
        /* 전략별 태그 디자인 */
        .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle; font-weight: normal; }
        .tag-s1 { background: #3e2723; color: #d4a017; border: 1px solid #d4a017; } /* 중간수 */
        .tag-s2 { background: #1b5e20; color: #81c784; border: 1px solid #81c784; } /* 12수 */
        .tag-s3 { background: #b71c1c; color: #ef5350; border: 1px solid #ef5350; } /* 미출현 */
        
        .timer-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; color: #ff4d4d; border-radius: 8px; font-size: 20px; }
    </style>
</head>
<body>
    <h1 onclick="location.reload()">신의 손</h1>
    <div class="target-box">🎯 1211회 분석 (최근 45회 무중략 데이터 탑재)</div>

    <div class="btn-container">
        <button class="btn-main" id="btn10" onclick="process()">운명의 10조합 추출 시작<div id="timer10" class="timer-overlay"></div></button>
    </div>

    <div id="console">▶ 시스템 준비 완료.
사장님의 전략(1-10번 구간별 로직)이 세팅되었습니다.</div>

    <script>
        // [중략 없음] 사장님이 지시하신 최근 45회차 데이터 전체 수동 입력
        const RAW_DATA = [
            [1210,1,7,9,17,27,38,31],[1209,2,17,20,35,37,39,24],[1208,6,27,30,36,38,42,25],[1207,10,22,24,27,38,45,11],
            [1206,1,3,17,26,27,42,23],[1205,1,4,16,23,31,41,2],[1204,8,16,28,30,31,44,27],[1203,3,6,18,29,35,39,24],
            [1202,5,12,21,33,37,40,7],[1201,7,9,24,27,35,36,37],[1200,1,2,4,16,20,32,45,11],[1199,16,24,25,30,31,32,7],
            [1198,26,30,33,38,39,41,21],[1197,1,5,7,26,28,43,30],[1196,8,12,15,29,40,45,14],[1195,11,14,15,19,38,10,10],
            [1194,1,2,3,4,5,6,7],[1193,6,9,16,19,24,28,17],[1192,10,16,23,36,39,40,11],[1191,1,4,11,12,20,41,2],
            [1190,7,9,19,23,26,45,33],[1189,9,19,29,35,37,38,31],[1188,3,4,12,19,22,27,9],[1187,5,13,26,29,37,40,42],
            [1186,2,8,13,16,23,28,35],[1185,6,17,22,28,29,32,38],[1184,14,16,23,25,31,37,42],[1183,4,15,17,23,27,36,31],
            [1182,1,13,21,25,28,31,22],[1181,8,10,14,20,33,41,28],[1180,6,12,18,37,40,41,3],[1179,3,16,18,24,40,44,21],
            [1178,5,6,11,27,43,44,17],[1177,3,7,15,16,19,43,21],[1176,7,9,11,21,30,35,29],[1175,3,4,6,8,32,42,31],
            [1174,8,11,14,17,36,39,22],[1173,1,5,18,20,30,35,3],[1172,7,9,24,40,42,44,45],[1171,3,6,7,11,12,17,19],
            [1170,3,13,28,34,38,42,25],[1169,5,12,24,26,39,42,20],[1168,9,21,24,30,33,37,29],[1167,8,23,31,35,39,40,24],
            [1166,14,23,25,27,29,42,16]
        ];

        let top12 = [], midRank = [], zeroOut = [], bonusHot = [];

        function initSystem() {
            // 1. 보너스 가중치 분석 (45회 기준)
            let bStats = {};
            for(let i=1; i<=45; i++) bStats[i] = { c:0, s:0 };
            RAW_DATA.forEach((d, i) => { 
                let b = d[7]; 
                if(b) { bStats[b].c++; bStats[b].s += (45-i); } 
            });
            top12 = Object.keys(bStats).map(Number).sort((a,b) => bStats[b].s - bStats[a].s).slice(0,12);
            midRank = top12.slice(4, 8); // 중간 (5-8위)
            bonusHot = top12.slice(0, 5); // 상위 (1-5위)

            // 2. 미출현수 분석 (최근 30회 기준)
            let r30 = RAW_DATA.slice(0, 30);
            let appeared = new Set();
            r30.forEach(d => { for(let i=1; i<=6; i++) appeared.add(d[i]); });
            for(let i=1; i<=45; i++) { if(!appeared.has(i)) zeroOut.push(i); }
            if(zeroOut.length === 0) r30.forEach(d => zeroOut.push(d[7])); // 미출 없으면 보너스 대체
        }

        function getAC(arr) {
            let d = new Set();
            for(let i=0; i<6; i++) { for(let j=i+1; j<6; j++) d.add(Math.abs(arr[i]-arr[j])); }
            return d.size - 5;
        }

        function process() {
            const box = document.getElementById('console');
            box.innerHTML = "▶ 1211회차 분석 엔진 가동...\n--------------------------------\n";
            let gen = 0, safety = 0;

            while(gen < 10 && safety < 30000) {
                safety++;
                let res = [], cur = gen + 1, tagStr = "";

                if(cur <= 2) { // [전략1] 중간수 1개 고정 + 12수
                    res.push(midRank[Math.floor(Math.random()*midRank.length)]);
                    let p = top12.filter(n => !res.includes(n));
                    while(res.length < 6) res.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);
                    tagStr = "<span class='tag tag-s1'>중간수고정</span>";
                } 
                else if(cur <= 7) { // [전략2] 12수 완전 랜덤
                    let p = [...top12];
                    while(res.length < 6) res.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);
                    tagStr = "<span class='tag tag-s2'>12수집중</span>";
                }
                else if(cur === 8) { // [전략3-1] 미출현 1개 + 12수
                    res.push(zeroOut[Math.floor(Math.random()*zeroOut.length)]);
                    let p = top12.filter(n => !res.includes(n));
                    while(res.length < 6) res.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);
                    tagStr = "<span class='tag tag-s3'>미출현1개</span>";
                }
                else if(cur === 9) { // [전략3-2] 미출현 2개 + 12수
                    let zp = [...zeroOut];
                    for(let i=0; i<2; i++) res.push(zp.splice(Math.floor(Math.random()*zp.length),1)[0]);
                    let p = top12.filter(n => !res.includes(n));
                    while(res.length < 6) res.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);
                    tagStr = "<span class='tag tag-s3'>미출현2개</span>";
                }
                else if(cur === 10) { // [전략3-3] 보너스핫 2개 + 미출현 1개
                    let bh = [...bonusHot];
                    for(let i=0; i<2; i++) res.push(bh.splice(Math.floor(Math.random()*bh.length),1)[0]);
                    res.push(zeroOut[Math.floor(Math.random()*zeroOut.length)]);
                    let p = top12.filter(n => !res.includes(n));
                    while(res.length < 6) res.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);
                    tagStr = "<span class='tag tag-s1'>필살기믹스</span>";
                }

                res.sort((a,b) => a-b);
                let sum = res.reduce((a,b)=>a+b, 0), ac = getAC(res);

                // 사장님 커스텀 필터 (합계 100~175, AC 7이상)
                if(sum >= 100 && sum <= 175 && ac >= 7) {
                    gen++;
                    box.innerHTML += "(" + gen + ") " + res.map(n => n<10?'0'+n:n).join("  ") + tagStr + "\n";
                }
            }
            startTimer();
        }

        function startTimer() {
            let b = document.getElementById('btn10'), o = document.getElementById('timer10');
            b.disabled = true; o.style.display = 'flex';
            let s = 30;
            let t = setInterval(() => {
                o.innerText = s + "초 후 다시 추출 가능";
                if(s-- <= 0) { clearInterval(t); b.disabled = false; o.style.display = 'none'; }
            }, 1000);
        }

        window.onload = initSystem;
    </script>
</body>
</html>
