<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신 의 손 v20.0 - 분석 엔진 통합본</title>
    <style>
        :root { --gold: #ffd700; --bg: #0b0b0b; --card: #1a1a1a; --accent: #00ffcc; --save: #ff00ff; --danger: #ff4500; }
        body { background-color: var(--bg); color: var(--gold); font-family: 'Malgun Gothic', sans-serif; padding: 10px; margin: 0; }
        .outer-border { border: 2px solid var(--gold); border-radius: 20px; padding: 15px; max-width: 480px; margin: 0 auto; }
        
        /* 상단 헤더 */
        .header-box { text-align: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .main-title { font-size: 26px; font-weight: 900; color: var(--gold); letter-spacing: 1px; cursor: pointer; }
        .target-info { font-size: 13px; color: var(--accent); margin-top: 5px; line-height: 1.4; }

        /* 메인 버튼 */
        .btn-group { margin-bottom: 15px; }
        .btn-main { width: 100%; height: 60px; background: linear-gradient(to bottom, #ffd700, #b8860b); color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2); }
        .btn-main:active { transform: scale(0.98); }

        /* 결과창 레이아웃 */
        .row-line { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; }
        .row-idx { font-size: 12px; color: #666; width: 25px; font-weight: bold; }
        .num-container { display: flex; gap: 6px; flex-grow: 1; justify-content: center; }
        
        /* 번호 공 스타일 */
        .num-box { width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 15px; font-weight: 900; border-radius: 50%; font-family: 'Consolas', monospace; }
        .fixed { background: #ff8c00; color: #000; } /* 분석 고정수 */
        .zero { background: var(--danger); color: #fff; text-decoration: underline; } /* 미출현수 */
        .normal { background: #333; color: #fff; border: 1px solid var(--gold); }
        
        .info-tag { font-size: 11px; color: #555; width: 45px; text-align: right; }
    </style>
</head>
<body>

<div class="outer-border">
    <div class="header-box">
        <div class="main-title" onclick="location.reload()">신 의 손 v20.0</div>
        <div class="target-info">💎 제 1212회 분석 엔진 가동 중<br>[30회차 전수 분석 + 40번대 유동적 배분]</div>
    </div>

    <div class="btn-group">
        <button class="btn-main" onclick="process()">분석 엔진 10조합 추출</button>
    </div>

    <div id="console">
        </div>
</div>

<script>
    // v9.9.0 로직 데이터 및 변수
    const DATA = [[23, 26, 27, 35, 38, 40],[1,7,9,17,27,38],[2,17,20,35,37,39],[6,27,30,36,38,42],[10,22,24,27,38,45],[1,3,17,26,27,42],[1,4,16,23,31,41],[8,16,28,30,31,44],[3,6,18,29,35,39],[5,12,21,33,37,40],[7,9,24,27,35,36],[1,2,4,16,20,32],[16,24,25,30,31,32],[26,30,33,38,39,41],[1,5,7,26,28,43],[8,12,15,29,40,45],[3,15,27,33,34,36],[3,13,15,24,33,37],[6,9,16,19,24,28],[10,16,23,36,39,40],[1,4,11,12,20,41],[7,9,19,23,26,45],[9,19,29,35,37,38],[3,4,12,19,22,27],[5,13,26,29,37,40],[2,8,13,16,23,28],[6,17,22,28,29,32],[14,16,23,25,31,37],[4,15,17,23,27,36],[1,13,21,25,28,31],[8,10,14,20,33,41]];
    const bonus = [35, 10, 43]; 
    let basket = [], zeroFreqNums = [], machineFixed = [];

    // 분석 로직 (기존 v9.9.0 동일)
    function analyze() {
        let freq = {}, serial = {};
        for(let i=1; i<=45; i++) { freq[i]=0; serial[i]=0; }
        DATA.forEach(row => {
            row.forEach((n, i) => {
                freq[n]++;
                if(i < 5 && row[i+1] === n + 1) { serial[n]++; serial[n+1]++; }
            });
        });

        let scored = Object.keys(freq).map(Number).sort((a,b) => {
            let sA = freq[a] * 1.5 + (serial[a] || 0) * 2;
            let sB = freq[b] * 1.5 + (serial[b] || 0) * 2;
            return sB - sA;
        });

        basket = scored.slice(0, 22); 
        machineFixed = [scored[0], scored[1], 27];
        zeroFreqNums = Object.keys(freq).filter(n => freq[n] === 0).map(Number);
    }

    function process() {
        analyze();
        const box = document.getElementById('console');
        box.innerHTML = "";
        let count = 0, used = new Set(), safety = 0;

        while(count < 10 && safety < 5000) {
            safety++;
            let res = [];
            if(count < 7) { 
                res.push(machineFixed[count % 3]); 
            } else {
                res.push(bonus[count - 7]);
                if(count === 9) {
                    let shuffledZeros = [...zeroFreqNums].sort(() => Math.random() - 0.5);
                    for(let z of shuffledZeros) { if(res.length < 6) res.push(z); }
                }
            }
            
            let tempBasket = [...basket].sort(() => Math.random() - 0.5);
            for(let n of tempBasket) { if(res.length < 6 && !res.includes(n)) res.push(n); }
            
            while(res.length < 6) {
                let n = Math.floor(Math.random()*45)+1;
                if(!res.includes(n)) res.push(n);
            }

            res.sort((a,b)=>a-b);
            let sum = res.reduce((a,b)=>a+b, 0);
            let isPass = (count === 9) ? (sum >= 70 && sum <= 220) : (sum >= 100 && sum <= 190);

            if(!used.has(res.join(',')) && isPass) {
                used.add(res.join(','));
                count++;
                
                // 새로운 디자인 스타일로 번호 출력
                const numsHtml = res.map(n => {
                    let type = "normal";
                    if(machineFixed.includes(n) || bonus.includes(n)) type = "fixed";
                    if(zeroFreqNums.includes(n)) type = "zero";
                    return `<span class="num-box ${type}">${String(n).padStart(2,'0')}</span>`;
                }).join('');
                
                box.innerHTML += `
                    <div class="row-line">
                        <span class="row-idx">#${count}</span>
                        <div class="num-container">${numsHtml}</div>
                        <span class="info-tag">합:${sum}</span>
                    </div>`;
            }
        }
    }

    window.onload = analyze;
</script>

</body>
</html>
