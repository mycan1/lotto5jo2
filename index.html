<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신의 손 v9.8 - 기계적 정밀 분석</title>
    <style>
        body { background-color: #000; color: #ffd700; font-family: 'Malgun Gothic', sans-serif; text-align: center; padding: 20px; margin: 0; }
        .outer-border { border: 4px solid #ffd700; border-radius: 40px; padding: 10px; max-width: 450px; margin: 0 auto; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
        .inner-container { border: 2px solid #ffd700; border-radius: 32px; padding: 30px 20px; background: #0c0c0c; }
        h1 { font-size: 38px; font-weight: 900; margin: 0; letter-spacing: 5px; cursor: pointer; color: #ffd700; text-shadow: 2px 2px 4px #000; }
        .target-box { color: #00ffcc; font-size: 14px; font-weight: 900; margin: 15px 0; background: #1a1a1a; padding: 12px; border-radius: 15px; border: 2px solid #00ffcc; line-height: 1.5; }
        .btn-main { width: 100%; height: 70px; background: linear-gradient(to bottom, #fdf24d, #b8a000); border: none; border-radius: 20px; font-size: 20px; font-weight: 900; cursor: pointer; margin-bottom: 20px; color: #000; }
        #console { background-color: #050505; border: 2px solid #333; border-radius: 20px; height: 500px; padding: 15px; text-align: left; overflow-y: auto; color: #ffd700; font-size: 14px; line-height: 2.2; border-left: 4px solid #ffd700; }
        .ball { display: inline-block; width: 30px; height: 30px; background: radial-gradient(circle at 30% 30%, #ffd700, #b8a000); color: #000; border-radius: 50%; text-align: center; line-height: 30px; font-weight: bold; margin-right: 5px; font-size: 14px; box-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .ball-hot { background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00); color: #000; border: 1px solid #fff; }
        .ball-mid { background: radial-gradient(circle at 30% 30%, #00ffcc, #008b8b); color: #000; }
        .ball-zero { background: radial-gradient(circle at 30% 30%, #ff4500, #8b0000); color: #fff; border: 2px solid #fff; }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #333; color: #fff; margin-right: 5px; vertical-align: middle; }
    </style>
</head>
<body>
<div class="outer-border">
    <div class="inner-container">
        <h1 onclick="location.reload()">신 의 손 v9.8</h1>
        <div class="target-box">💎 기계적 3대 고정수(빈도·연번·회귀) 추출<br>1~7조합 분산 투입 / 1~2조합 쌍연번 필터</div>
        <button class="btn-main" onclick="process()">분석 엔진 10조합 가동</button>
        <div id="console">▶ 형님, 기계적 데이터 분석 준비 완료!</div>
    </div>
</div>

<script>
    const DATA = [
        [1,7,9,17,27,38],[2,17,20,35,37,39],[6,27,30,36,38,42],[10,22,24,27,38,45],
        [1,3,17,26,27,42],[1,4,16,23,31,41],[8,16,28,30,31,44],[3,6,18,29,35,39],
        [5,12,21,33,37,40],[7,9,24,27,35,36],[1,2,4,16,20,32],[16,24,25,30,31,32],
        [26,30,33,38,39,41],[1,5,7,26,28,43],[8,12,15,29,40,45],[3,15,27,33,34,36],
        [3,13,15,24,33,37],[6,9,16,19,24,28],[10,16,23,36,39,40],[1,4,11,12,20,41],
        [7,9,19,23,26,45],[9,19,29,35,37,38],[3,4,12,19,22,27],[5,13,26,29,37,40],
        [2,8,13,16,23,28],[6,17,22,28,29,32],[14,16,23,25,31,37],[4,15,17,23,27,36],
        [1,13,21,25,28,31],[8,10,14,20,33,41]
    ];

    let top15 = [];
    let zeroFreqNums = [];
    let machineFixed = []; // 기계적 고정수 3개

    function analyze() {
        let freq = {};
        let serialCount = {};
        let lastSeen = {};
        for(let i=1; i<=45; i++) { freq[i] = 0; serialCount[i] = 0; lastSeen[i] = 99; }

        DATA.forEach((row, idx) => {
            row.forEach((n, i) => {
                freq[n]++;
                if(lastSeen[n] === 99) lastSeen[n] = idx;
                // 연번 유도력 계산
                if(i < 5 && row[i+1] === n + 1) {
                    serialCount[n]++;
                    serialCount[n+1]++;
                }
            });
        });

        // 1. 빈도 대장 (가장 많이 나온 수)
        let f1 = Object.keys(freq).sort((a,b) => freq[b] - freq[a])[0];
        // 2. 연번 대장 (연번으로 가장 많이 등장한 수)
        let f2 = Object.keys(serialCount).sort((a,b) => serialCount[b] - serialCount[a])[0];
        // 3. 회귀 대장 (빈도는 높은데 최근 5회 이상 안 나온 수 중 최우선)
        let f3 = Object.keys(freq)
            .filter(n => lastSeen[n] >= 5)
            .sort((a,b) => freq[b] - freq[a])[0];

        machineFixed = [parseInt(f1), parseInt(f2), parseInt(f3)];

        zeroFreqNums = Object.keys(freq).filter(n => freq[n] === 0).map(Number);
        
        let weightedFreq = {};
        for(let i=1; i<=45; i++) weightedFreq[i] = 0;
        DATA.forEach((row, idx) => {
            let weight = 1 + ((30 - idx) / 30);
            row.forEach(n => { weightedFreq[n] += weight; });
        });
        top15 = Object.keys(weightedFreq).map(Number).sort((a,b) => weightedFreq[b] - weightedFreq[a]).slice(0, 15);
    }

    function process() {
        analyze();
        const box = document.getElementById('console');
        box.innerHTML = `<div style="color:#00ffcc; font-size:12px; margin-bottom:10px;">📊 기계 분석 고정수: [${machineFixed.join(', ')}] 분산 배치 중...</div>`;
        
        const bonusStrategy = [35, 10, 43]; 
        let count = 0;
        let usedCombinations = new Set();
        let safetyBreak = 0;

        while(count < 10 && safetyBreak < 10000) {
            safetyBreak++;
            let res = [];
            
            // [핀셋 로직] 1~7조합 고정수 1개씩 순환 투입
            if(count < 7) {
                res.push(machineFixed[count % 3]);
            }

            if(count >= 7) res.push(bonusStrategy[count - 7]);
            if(count === 9) {
                let shuffledZero = [...zeroFreqNums].sort(() => Math.random() - 0.5);
                for(let i=0; i < Math.min(shuffledZero.length, 3); i++) {
                    if(!res.includes(shuffledZero[i])) res.push(shuffledZero[i]);
                }
            }

            let basket = [...top15].sort(() => Math.random() - 0.5);
            for(let num of basket) {
                if(res.length < 6 && !res.includes(num)) res.push(num);
            }
            while(res.length < 6) {
                let n = Math.floor(Math.random() * 45) + 1;
                if(!res.includes(n)) res.push(n);
            }

            res.sort((a,b) => a-b);
            let sum = res.reduce((a,b) => a+b, 0);
            let odds = res.filter(n => n % 2 !== 0).length;
            let unitSum = res.reduce((a,b) => a + (b % 10), 0);
            let maxConsecutive = 1, currentConsecutive = 1, pairCount = 0;

            for(let i=0; i < res.length - 1; i++) {
                if(res[i+1] === res[i] + 1) {
                    currentConsecutive++;
                    if(currentConsecutive === 2) pairCount++;
                } else {
                    maxConsecutive = Math.max(maxConsecutive, currentConsecutive);
                    currentConsecutive = 1;
                }
            }
            maxConsecutive = Math.max(maxConsecutive, currentConsecutive);

            let isPass = (sum >= 100 && sum <= 175) && (odds >= 2 && odds <= 4) && (unitSum >= 15 && unitSum <= 35) && (maxConsecutive < 3);
            if(count < 2) { if(pairCount !== 1 || maxConsecutive !== 2) isPass = false; }

            let key = res.join(',');
            if(!usedCombinations.has(key) && isPass) {
                usedCombinations.add(key);
                count++;
                const balls = res.map(n => {
                    let c = 'ball';
                    if(zeroFreqNums.includes(n)) c += ' ball-zero';
                    else if(top15.slice(0,7).includes(n)) c += ' ball-hot';
                    else if(top15.includes(n)) c += ' ball-mid';
                    return `<span class="${c}" style="${bonusStrategy.includes(n) ? "border: 2px solid #00ffcc;" : ""}">${n}</span>`;
                }).join('');
                box.innerHTML += `<div><span class="tag">#${count}</span> ${balls} <small style="color:#555">${count <= 2 ? "[쌍연번]" : "[일반]"} 합:${sum}</small></div>`;
            }
        }
    }
    window.onload = analyze;
</script>
</body>
</html>
